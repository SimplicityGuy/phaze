{% import "ui/primitives.html" as ui %}
<div data-source-action-result role="{{ 'alert' if failed else 'status' }}" class="my-2 text-sm {{ 'text-danger' if failed else 'text-ok' }}">
    <p>{{ message }}</p>
    {% if result is defined %}<p>Tracklist: {{ result.tracklist_status }} · release info: {{ result.release_status }}</p>{% endif %}
    {% if file_id is defined and not failed %}<div hx-get="/files/{{ file_id }}/companion-details{% if review_source_id | default(none) %}?review_source_id={{ review_source_id }}{% endif %}" hx-trigger="load" hx-target="closest [data-companion-overview]" hx-swap="outerHTML"></div>{% endif %}
</div>
