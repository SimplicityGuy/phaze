{% import "ui/primitives.html" as ui %}
<div data-source-action-result role="{{ 'alert' if failed else 'status' }}" class="my-2 text-sm {{ 'text-danger' if failed else 'text-ok' }}">
    <p>{{ message }}</p>
    {% if result is defined %}<p>Tracklist: {{ result.tracklist_status }} · release metadata: {{ result.release_status }}</p>{% endif %}
    {% if file_id is defined %}<a href="/files/{{ file_id }}#companion-sources" class="text-link">Open updated file details</a><button type="button" hx-get="/files/{{ file_id }}/companion-details" hx-target="#companion-sources" hx-swap="outerHTML" class="{{ ui.btn('secondary', 'sm', 'max-w-full h-auto py-2') | replace('whitespace-nowrap', 'whitespace-normal') | replace('shrink-0', 'shrink') }}">Update source list</button>{% endif %}
</div>
