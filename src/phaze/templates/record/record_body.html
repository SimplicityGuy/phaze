{# Bare drawer presentation for the canonical file-record content. This remains a one-shot
   snapshot: no polling, timers, or OOB refreshes may be added here. #}
<div data-file-id="{{ file.id }}" class="flex flex-col">
    <div class="sticky top-0 z-10 border-b border-gray-200 bg-white px-6 py-4 dark:border-phaze-border dark:bg-phaze-bg">
        <div class="flex items-start justify-between gap-4">
            <div class="min-w-0">
                <h2 tabindex="-1" class="truncate font-jura text-[18px] uppercase tracking-[0.15em] text-gray-900 outline-none dark:text-gray-100">{{ file.original_filename }}</h2>
                <p class="mt-1 truncate font-mono text-xs text-muted" title="{{ file.current_path }}">{{ file.current_path }}</p>
                <a href="/files/{{ file.id }}"
                   class="mt-2 inline-flex font-jura text-xs font-medium uppercase tracking-wider text-link hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    Open full page
                </a>
            </div>
            <button type="button" @click="hide()" aria-label="Close record"
                    class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:hover:bg-white/5">✕</button>
        </div>
    </div>
    {% include "record/_record_content.html" %}
</div>
