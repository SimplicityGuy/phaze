{% import "ui/primitives.html" as ui %}
<div role="alert" x-init="tagApprovalStale = true" class="rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-xs text-amber-900 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-200">
    <p>Tag approval refused: {{ reason }}. No tag write was queued.</p>
    <p class="mt-1">Refresh review evidence and inspect the current source and tag changes before approving again.</p>
    <button type="button" @click="window.location.reload()" class="{{ ui.btn('secondary', 'sm', 'mt-2') }}">Refresh review evidence</button>
</div>
