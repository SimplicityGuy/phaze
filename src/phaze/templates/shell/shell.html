<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ document_title }} | Phaze</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ static_url('favicon.ico') }}">
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="{{ static_url('favicon-32.svg') }}">
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="{{ static_url('favicon-16.svg') }}">
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="{{ static_url('favicon-192.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ static_url('favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ static_url('favicon-16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ static_url('apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ static_url('site.webmanifest') }}">
    <meta property="og:image" content="{{ static_url('og_image.png') }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Tailwind CSS — pre-built at image-build time by the pinned standalone
         Tailwind v4 binary (see Dockerfile css-builder stage / `just tailwind`).
         Replaces the former in-browser compiler (@tailwindcss/browser): no
         276 KB JS, no client-side compile pass. Theme config (@theme), the dark
         variant, @source, and the plain rules all live in assets/src/app.css.
         Self-hosted, deterministic, works on an isolated/private network.

         URL carries `?v=<content-hash>` (phaze-315t) so a deploy that changes
         this file is served under a NEW url — no operator-visible stale cache,
         and RevalidatingStaticFiles (phaze/web/static.py) answers a matching
         `?v=` with a year-long immutable Cache-Control instead of the
         phaze-mw9l no-cache fallback. -->
    <link rel="stylesheet" href="{{ static_url('css/app.css') }}">

    <!-- Jura font (design language primary) + Inter (body) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Jura:wght@300;500&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>

    <!-- HTMX SSE extension -->
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4/sse.js" integrity="sha384-QA9wXqexhwzXTuTvuF5QP82pddm3R2hy81UzXi7ioNTqNF2b75hlkkSGjafohhL3" crossorigin="anonymous"></script>

    <!-- Alpine Focus plugin (x-trap): powers the record slide-in + ⌘K palette focus-traps.
         MUST load BEFORE Alpine core — plugins register on core init, so load order is
         load-bearing; version pinned to Alpine core (3.15.12) + SRI SHA-384 (T-61-02 supply-chain). -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.15.12/dist/cdn.min.js" integrity="sha384-ysJcnHb6oCzqAGKdoTm+IqKqmPKgxHT+ApZCawkyWOJfMq15WvzW3RRmHl7tWpEY" crossorigin="anonymous"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js" integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L" crossorigin="anonymous"></script>

    <!-- Theme store: auto/dark/light with localStorage persistence.

         Alpine v3 does NOT process `:class` on the <html> element unless
         <html> carries an x-data directive (Alpine scans from <body> down).
         A previous version bound `:class="$store.theme.dark ? 'dark' : ''"`
         on <html> and it was silently inert — clicking the toggle changed
         `mode` in the store but the .dark class was never added/removed
         after the pre-flash script ran.

         Fix: drive the .dark class directly via classList from one place
         (`_applyTheme`). Both the toggle's set() and the OS-level
         prefers-color-scheme listener (for auto mode) call it. -->
    <script>
        function _applyTheme(mode) {
            const isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
        }
        // Prevent flash: apply dark class before Alpine loads.
        (function() {
            const mode = localStorage.getItem('phaze-theme') || 'auto';
            _applyTheme(mode);
        })();
        // OS-level dark-mode preference change must update the page when in auto mode.
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            const mode = localStorage.getItem('phaze-theme') || 'auto';
            if (mode === 'auto') _applyTheme('auto');
        });
        document.addEventListener('alpine:init', () => {
            Alpine.store('theme', {
                mode: localStorage.getItem('phaze-theme') || 'auto',
                get dark() {
                    if (this.mode === 'dark') return true;
                    if (this.mode === 'light') return false;
                    return window.matchMedia('(prefers-color-scheme: dark)').matches;
                },
                set(mode) {
                    this.mode = mode;
                    localStorage.setItem('phaze-theme', mode);
                    _applyTheme(mode);
                }
            });
            // Pipeline dashboard single-source-of-truth for the live "files ready"
            // counts AND the live queue-busy gates. Both the count text and the four
            // pipeline-action button :disabled bindings (Run Analysis /
            // Extract Metadata / Generate Proposals) read this store; the 5s
            // /pipeline/stats poll pushes fresh values via x-init on its OOB count +
            // busy-seed paragraphs so the buttons un-disable the instant a scan
            // surfaces files OR a queued run drains WITHOUT the poll ever re-rendering
            // (and clobbering) the interactive button subtree.
            // discovered/analyzed/metadataExtracted are "files ready" stage counts;
            // agentBusy/controllerBusy are the live SAQ queue depths that gate the
            // buttons against double-enqueue. All five are seeded from the
            // server-rendered counts at page load (see the DAG canvas seeds) and refreshed
            // by the poll OOB nodes, so every :disabled binding has a defined default
            // before the first poll tick (never reads undefined).
            // Phase 35 (35-04) DAG-canvas extension: per-node sub-keys feeding the
            // node-edge pipeline graph (35-05). EVERY key is seeded to 0 here so no
            // node binding ever reads `undefined` before the first /pipeline/stats
            // poll tick. done/total/active come from the server context (35-04 router)
            // and are refreshed by the OOB x-init seeds in stats_bar.html on each 5s
            // poll. The Phase-34 keys (discovered/analyzed/metadataExtracted/agentBusy/
            // controllerBusy) are PRESERVED — the existing button :disabled gating reads
            // them.
            Alpine.store('pipeline', {
                discovered: 0, analyzed: 0, metadataExtracted: 0, agentBusy: 0, controllerBusy: 0,
                // t7k FIX2: per-stage in-flight busy counts replace the single global agentBusy
                // gate so each agent enqueue button gates on its OWN stage (run in parallel).
                // agentBusy is kept — the queue_progress card path still reads agent_busy server-side.
                metadataBusy: 0, analyzeBusy: 0,
                // Phase 40 (REQ-40-3): online-agent count ("Needs agent" when 0) gates the per-agent
                // DAG nodes — same seed/OOB poll.
                agentOnline: 0,
                // Phase 41 (REQ-41-3): match_tracklist_to_discogs in-flight count gates the DAG Match
                // trigger node ("Matching…") — same seed/OOB poll. phaze-2akf dropped the searchBusy /
                // scrapeBusy siblings with the two legacy tasks they counted.
                matchBusy: 0,
                metadataDone: 0, metadataTotal: 0,
                analyzeDone: 0, analyzeTotal: 0, analyzeActive: 0,
                tracklistDone: 0,
                matchDone: 0, matchTotal: 0,
                proposalsDone: 0, proposalsTotal: 0,
                approved: 0,
                executedDone: 0, executedTotal: 0,
                // Phase 38 (38-03): per-stage pause/priority live state (REQ-38-4). Seeded
                // to int 0 so no control binding reads `undefined` before the first poll;
                // the dag.items() OOB loop in stats_bar.html pushes the real values each 5s.
                metadataPaused: 0, metadataPriority: 0,
                analyzePaused: 0, analyzePriority: 0,
                // Phase 58: derived workspace sub-counts seeded to int 0 so no x-text binding
                // reads `undefined` on initial shell paint (Discover sub-count / A1 lane capacity);
                // the dag.items() OOB loop pushes real values onto dag-seed-notYetEnriched /
                // dag-seed-computeOnline each 5s poll (58-02, 58-04 — WORK-01/03/05).
                notYetEnriched: 0, computeOnline: 0,
                // COMPUTE-02: count of ACTIVE compute lanes, additive to agentOnline for the header
                // "Agents · N" total. A read-only derived int seeded onto the dag dict server-side;
                // rides the existing dag.items() OOB loop onto dag-seed-computeLanesActive.
                computeLanesActive: 0,
                // phaze-uvmcr.5: Phase 87 (87-08, UI-05) per-enrich-stage orphaned/stuck
                // (recovery-candidate) counts. These two keys lived only in the now-deleted
                // base.html, which never had a live caller once audit/agents moved onto this
                // shell -- an oversight that would have re-created the exact "rail renders
                // server-side 0 forever" defect CONSOLE-02 already fixed once (rail.html's
                // amber orphan badges bind $store.pipeline.{metadata,analyze}Orphan and would
                // have silently stuck at their seed value with no poll ever reaching them).
                // Seeded to int 0 so no x-show/x-text binding ever reads `undefined` before the
                // first /pipeline/stats poll tick; the dag.items() OOB loop in stats_bar.html
                // pushes the real values each 5s poll via dag-seed-metadataOrphan /
                // dag-seed-analyzeOrphan (tests/shared/core/test_workspace_poll_seeds.py).
                metadataOrphan: 0, analyzeOrphan: 0
            });
            // phaze-cvn6.3: pipeline files-table column widths. A page-level singleton (mirrors the
            // theme store's localStorage shape above) is what lets a dragged width survive every
            // htmx sort/filter/pager swap of #files-table-view -- that swap replaces the WHOLE
            // colgroup/thead/tbody subtree (see files_table_view.html), so anything held in a
            // per-swap Alpine component's local state would reset on the very next click. The store
            // is untouched by the swap; the fresh markup's `:style` bindings just re-read it.
            Alpine.store('colResize', {
                _key: 'phaze-pipeline-col-widths',
                // Defaults approximate this table's current un-resized (auto-layout) proportions;
                // mins are the narrowest a column can go before dragging it further is a no-op --
                // for the six stage columns that floor is enforced by auto table-layout itself
                // (their un-truncated pill+Retry content refuses to shrink below its own width, see
                // the colgroup comment in files_table_view.html), these are just a sane JS-side floor
                // so a fast drag never reports a negative or zero width mid-gesture.
                defaults: { File: 320, Type: 88, Meta: 104, FP: 104, Analyze: 132, Prop: 104, Appr: 104, Exec: 104 },
                mins: { File: 140, Type: 64, Meta: 84, FP: 84, Analyze: 96, Prop: 84, Appr: 84, Exec: 84 },
                max: 900,
                widths: (() => {
                    try {
                        return JSON.parse(localStorage.getItem('phaze-pipeline-col-widths')) || {};
                    } catch {
                        return {};
                    }
                })(),
                width(col) {
                    return this.widths[col] ?? this.defaults[col] ?? 120;
                },
                setWidth(col, px) {
                    const min = this.mins[col] ?? 64;
                    const clamped = Math.min(Math.max(Math.round(px), min), this.max);
                    this.widths = { ...this.widths, [col]: clamped };
                    localStorage.setItem(this._key, JSON.stringify(this.widths));
                }
            });
            // The drag behavior itself: registered once as a reusable Alpine.data() component (NOT
            // inlined via a plain `x-data`) so it re-attaches automatically to the fresh
            // `x-data="colResizer()"` element every htmx swap re-creates -- Alpine's mutation
            // observer initializes it from this global registration with no extra wiring needed.
            Alpine.data('colResizer', () => ({
                startResize(event, col) {
                    const startX = event.clientX;
                    const startWidth = this.$store.colResize.width(col);
                    const onMove = (moveEvent) => {
                        this.$store.colResize.setWidth(col, startWidth + (moveEvent.clientX - startX));
                    };
                    const onUp = () => {
                        document.removeEventListener('pointermove', onMove);
                        document.removeEventListener('pointerup', onUp);
                    };
                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onUp);
                    event.preventDefault();
                }
            }));
        });
    </script>

</head>
<body class="bg-white dark:bg-phaze-bg text-gray-900 dark:text-gray-200 h-screen overflow-hidden flex flex-col transition-colors duration-200">

    <!-- Skip link → the stable swap target (Focus/ARIA baseline) -->
    <a href="#stage-workspace" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:bg-blue-600 focus:text-white focus:px-4 focus:py-2 focus:rounded focus:z-50">Skip to workspace</a>

    <!-- Header (h-14): wave logo · ⌘K affordance · D-05 agent status strip · theme toggle. -->
    {% include "shell/partials/header.html" %}

    <!-- Three-column body row. Each column scrolls independently. -->
    <div class="flex flex-1 min-h-0">
        <!-- DAG rail (w-[280px]): the nav spine + live counts (SHELL-02). -->
        {% include "shell/partials/rail.html" %}

        <!-- Center workspace — the single stable swap target every rail node innerHTML-swaps. -->
        <main class="flex-1 min-w-0 bg-white dark:bg-phaze-bg">
            <div id="stage-workspace" data-stage="{{ stage }}" data-document-title="{{ document_title }}" class="h-full overflow-y-auto">{% include stage_partial %}</div>
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- ⌘K skeleton command palette (D-04). Its x-init also reads the `palette` query param
         (the /search → /?palette=1 rename target, Plan 04) to auto-open on load (A3). -->
    {% include "shell/partials/cmdk_modal.html" %}

    <!-- Phase 61 (RECORD-01 / D-01): the persistent full-record slide-in host. A sibling of the
         cmdk modal, it lives OUTSIDE #stage-workspace so a rail swap never re-renders or destroys
         it. Opened via the `record:open` window event ($dispatch from a file row / ⌘K Files row);
         its #record-body is the HTMX innerHTML swap target for GET /record/{file_id}. It replaces
         the former empty 350px right <aside> detail pane (removed in Phase 62 / CUT-01). -->
    {% include "shell/partials/record_host.html" %}

    <!-- Single persistent live-refresh poll (WORK-05 / R-2 / R-3). Lives in chrome OUTSIDE
         #stage-workspace, so a rail swap never re-renders, duplicates, or stops it — there is
         exactly ONE /pipeline/stats poll for the whole shell (the v7.0 shell had no live poll
         element before this; the only prior poll lived in the never-rendered legacy
         pipeline/dashboard.html). It reuses the EXISTING GET /pipeline/stats endpoint verbatim
         (no new route): each 5s it innerHTML-swaps stats_bar.html, whose hx-swap-oob seeds fan
         out to $store.pipeline + the cloud-card targets that ride whatever workspace is mounted
         (Plans 02-04 provide those targets). The element stays hidden — its job is the OOB
         fanout, not a visible counts grid.
         R-3 shed: the `[document.visibilityState === 'visible']` trigger filter makes htmx skip
         the request on every tick while the tab is backgrounded (the interval keeps running but
         no fetch fires — a SINGLE poll element, never a second loop); the visibilitychange
         listener below resumes immediately on foreground. -->
    <!-- Phase 88 (88-01, DRILL-03 / D-02, RESEARCH OQ-2): carry the pushed ?lane= onto this single
         persistent lane poll. htmx 2.0.10 does NOT auto-append the pushed URL's query to the poll
         hx-get, so the selected lane id is sent explicitly via hx-vals. This is globally safe: on any
         page other than /s/analyze?lane=…, location.search has no `lane`, so hx-vals sends lane:null
         and pipeline_stats_partial highlights nothing (lookup-in-known-set miss). The _analyze_lanes
         grid then re-emits aria-current + the selected ring for the matching card on every 5s swap. -->
    <div id="pipeline-stats"
         hx-get="/pipeline/stats"
         hx-trigger="every 5s [document.visibilityState === 'visible'], refresh"
         hx-vals='js:{lane: new URLSearchParams(location.search).get("lane")}'
         hx-swap="innerHTML"
         class="hidden"></div>

    <!-- History restore + focus-to-heading re-init (Phase 57 Focus/ARIA baseline).
         htmx snapshots #stage-workspace innerHTML into its history cache and restores it on
         back/forward, firing htmx:historyRestore (htmx 2.0.10). Alpine does NOT auto-init
         restored DOM, so re-bind the swapped subtree and re-mark the active rail node. After
         a rail swap (htmx:afterSwap) and on restore, move focus to the stage <h1> so
         keyboard/SR users land in the new content. syncRailSelection is completed in Plan 03. -->
    <script>
        function syncRailSelection(path) {
            // Re-apply aria-current="page" to the rail node matching `path`; the active
            // visual (blue tint + inset bar) follows from that attribute via the rail's
            // aria-[current=page] variant. Map: "/" → summary (the landing node, matching what
            // GET / renders server-side since quick 260707-sq3 SQ3-02 repointed the default
            // landing from Analyze to Summary); "/s/<id>" → <id>. data-rail-stage is the
            // rail-node hook (distinct from #stage-workspace's own data-stage marker, so the
            // workspace div is never mis-selected).
            var stage = null;
            if (path === '/' || path === '') {
                stage = 'summary';
            } else {
                var m = path.match(/^\/s\/([^/?#]+)/);
                if (m) stage = m[1];
            }
            document.querySelectorAll('[data-rail-stage]').forEach(function (node) {
                if (node.getAttribute('data-rail-stage') === stage) {
                    node.setAttribute('aria-current', 'page');
                } else {
                    node.removeAttribute('aria-current');
                }
            });
        }
        function _focusStageHeading() {
            const ws = document.getElementById('stage-workspace');
            if (!ws) return;
            const heading = ws.querySelector('h1');
            if (heading) {
                if (!heading.hasAttribute('tabindex')) heading.setAttribute('tabindex', '-1');
                heading.focus();
            }
        }
        function syncDocumentTitle() {
            const ws = document.getElementById('stage-workspace');
            if (!ws) return;
            const marker = ws.querySelector('[data-document-title]');
            const title = marker ? marker.dataset.documentTitle : ws.dataset.documentTitle;
            if (title) document.title = title + ' | Phaze';
        }
        document.body.addEventListener('htmx:historyRestore', function () {
            const ws = document.getElementById('stage-workspace');
            if (ws && window.Alpine) Alpine.initTree(ws);
            syncRailSelection(location.pathname);
            syncDocumentTitle();
            _focusStageHeading();
        });
        document.body.addEventListener('htmx:beforeSwap', function (event) {
            // GET /record/{id} returns a friendly 404 fragment (record_not_found.html) when a
            // file was de-duplicated/removed between render and click. htmx does NOT swap non-2xx
            // by default, so opt the record panel back in for its 404 so the fragment shows
            // instead of the click silently doing nothing (WR-01).
            const d = event.detail;
            if (d && d.xhr && d.xhr.status === 404 && d.target && d.target.id === 'record-body') {
                d.shouldSwap = true;
                d.isError = false;
            }
            // PUT /tracklists/tracks/{id}/edit/{field} answers an over-width inline-edit value
            // (timestamp > varchar(20)) with a 422 that re-renders the SAME edit input, the
            // operator's typed value preserved, plus an inline reason -- not a bare rejection that
            // blanks what they just typed (phaze-81au). Same WR-01 opt-in shape as the 404 case
            // above: htmx does not swap non-2xx by default, so opt this one response back in.
            if (d && d.xhr && d.xhr.status === 422 && typeof d.xhr.responseURL === 'string' &&
                /\/tracklists\/tracks\/[^/]+\/edit\/[^/]+$/.test(d.xhr.responseURL)) {
                d.shouldSwap = true;
                d.isError = false;
            }
        });
        function incomingOobRoot(event, current) {
            const frag = event.detail && event.detail.fragment;
            if (!frag || !frag.querySelector || !current || !current.id) return null;
            return frag.querySelector('#' + current.id);
        }
        function transferPollState(current, incoming) {
            if (!current || !incoming) return;
            const focused = document.activeElement;
            if (focused && focused.id && (focused === current || current.contains(focused))) {
                incoming.dataset.pollRestoreFocus = focused.id;
            }
            current.querySelectorAll('[data-poll-preserve-disclosure][id]').forEach(function (disclosure) {
                if (!disclosure.open) return;
                const replacement = Array.from(incoming.querySelectorAll('[data-poll-preserve-disclosure][id]'))
                    .find(function (candidate) { return candidate.id === disclosure.id; });
                if (replacement) replacement.open = true;
            });
            current.querySelectorAll('[data-poll-preserve-response][id]').forEach(function (response) {
                const replacement = Array.from(incoming.querySelectorAll('[data-poll-preserve-response][id]'))
                    .find(function (candidate) { return candidate.id === response.id; });
                if (replacement) replacement.innerHTML = response.innerHTML;
            });
        }
        // Phase 95 (phaze-zqvh.3): bound the 5s poll's per-tick DOM churn on the #analyze-lanes grid.
        // Every /pipeline/stats tick re-emits the whole N-lane grid out-of-band (stats_bar.html). When the
        // lane state is UNCHANGED (a long-lived, mostly-idle tab -- the soak scenario), destroy-and-
        // recreating that grid + re-running Alpine.initTree over it every 5s is pure churn. htmx fires a
        // cancelable htmx:oobBeforeSwap on the CURRENT element before each OOB swap (htmx 2.0.10), with
        // event.detail.fragment carrying the incoming replacement; set detail.shouldSwap=false to SKIP the
        // swap (the mounted grid + its Alpine scope are preserved untouched). We skip ONLY when the incoming
        // data-lanes-hash equals what is already mounted -- so a real lane-state change (or the selected-lane
        // highlight) still swaps. This touches NOTHING else: the single poll, the ~35 store-seed OOB writes
        // ($store.pipeline keys still update every tick), and all cloud-card OOB swaps are unaffected.
        document.body.addEventListener('htmx:oobBeforeSwap', function (event) {
            const current = event.target;
            if (!current) return;
            const incoming = incomingOobRoot(event, current);
            if (!incoming) return;
            // Recovery requests target descendants of this OOB card. Replacing their source/target
            // mid-flight detaches the response sink and loses the acknowledgement, so defer this
            // observational refresh for one tick. The next poll catches up after the request settles.
            if (current.id === 'analysis-health-card' &&
                (current.matches('.htmx-request') || current.querySelector('.htmx-request'))) {
                event.detail.shouldSwap = false;
                return;
            }
            // OOB replacement must not collapse operator-open detail or erase a recovery response.
            // State is copied into the incoming fragment before htmx installs it, avoiding another
            // poll loop or an after-swap race.
            if (current.id === 'analysis-health-card' || current.id === 'analyze-lanes') {
                transferPollState(current, incoming);
            }
            if (current.id !== 'analyze-lanes') return;
            const nextHash = incoming.getAttribute('data-lanes-hash');
            const curHash = current.getAttribute('data-lanes-hash');
            // Both non-empty AND equal => the grid is byte-identical to what's mounted: skip the swap.
            if (nextHash && curHash && nextHash === curHash) {
                event.detail.shouldSwap = false;
            }
        });
        document.body.addEventListener('htmx:oobAfterSwap', function (event) {
            const swapped = (event.detail && event.detail.target) || event.target;
            const focusId = swapped && swapped.dataset ? swapped.dataset.pollRestoreFocus : null;
            if (!focusId) return;
            delete swapped.dataset.pollRestoreFocus;
            const replacement = document.getElementById(focusId);
            if (replacement) replacement.focus({ preventScroll: true });
        });
        document.body.addEventListener('htmx:afterSwap', function (event) {
            // htmx:afterSwap exposes the request target as event.detail.target (htmx 2.0.10);
            // fall back to event.target for the element the bubbling event fired on.
            const tgt = (event.detail && event.detail.target) || event.target;
            if (tgt && tgt.id === 'stage-workspace') {
                // A rail swap only replaces #stage-workspace; the rail itself is not
                // re-rendered, so re-sync the active node from the just-pushed URL
                // (hx-push-url has updated location.pathname by afterSwap).
                syncRailSelection(location.pathname);
                syncDocumentTitle();
                _focusStageHeading();
            }
        });
        // R-3 visibilitychange shed (WORK-05): the single #pipeline-stats poll's hx-trigger
        // filter `[document.visibilityState === 'visible']` already sheds the request on every
        // tick while the tab is backgrounded (htmx keeps the interval but skips the fetch — no
        // second loop). On return to foreground, fire ONE immediate refresh so the live values
        // catch up instead of sitting stale for up to the next 5s tick.
        // phaze-ircc: fire the poll element's own `refresh` hx-trigger (via htmx.trigger) instead
        // of a source-less htmx.ajax() call. htmx.ajax() with no `source` element substitutes
        // document.body as the attribute-inheritance root (htmx 2.0.10 issueAjaxRequest), so the
        // element's hx-vals (the selected `lane`) was silently dropped on every foreground-resume
        // refresh -- htmx.trigger() dispatches through the element itself, so hx-vals (and any
        // other hx-* the element declares) is honored exactly as the declarative 5s tick is.
        document.addEventListener('visibilitychange', function () {
            const pollEl = document.getElementById('pipeline-stats');
            if (!document.hidden && window.htmx && pollEl) {
                window.htmx.trigger(pollEl, 'refresh');
            }
        });
    </script>

    <!-- phaze-uvmcr.4 (H2): BLOCKER-2's htmx:responseError/htmx:sendError/htmx:afterSwap listener
         for the Compute/Agents pane's "Refresh failed" banner, relocated here from the retired
         admin/agents.html page-load <script>. That script used to run once per full-page load of
         /admin/agents; hosted instead inside a rail-swapped #stage-workspace fragment, it would
         either never execute (htmx does not run inline <script> tags on every swap path the way a
         full document load does) or run AGAIN on every visit, stacking a duplicate document.body
         listener that never detaches -- H2, the crux of that bead.

         Hosting it here, in shell.html's own body -- OUTSIDE #stage-workspace -- fixes it the same
         way the cmdk modal / record host above are fixed: shell.html is only ever evaluated on a
         full document load (a rail swap only replaces #stage-workspace's innerHTML; it never
         re-fetches shell.html), so this IIFE attaches its three listeners exactly ONCE, for the
         life of the tab, and they survive every subsequent #stage-workspace swap untouched.

         It does not assume the Compute/Agents pane is mounted: isOurTarget only matches an event
         whose swapped target id is agents-table-section, which is simply absent from the DOM on
         every OTHER stage -- so this is a harmless no-op there, not a pane-presence assumption.
         The banner MARKUP itself (role=alert, the localStorage-driven Alpine footer) is untouched
         -- it still lives in admin/partials/agents_table.html and keeps working whether the pane
         was reached by a full load or a rail swap. -->
    <script>
    (function () {
        var TARGET_ID = 'agents-table-section';
        var STORAGE_KEY = 'phaze:agents:lastError';
        function isOurTarget(evt) {
            var target = evt.detail && evt.detail.target;
            return !!(target && target.id === TARGET_ID);
        }
        function recordFailure(evt) {
            if (!isOurTarget(evt)) return;
            try { localStorage.setItem(STORAGE_KEY, new Date().toISOString()); }
            catch (e) { /* private-mode/quota: degrade silently */ }
        }
        function clearFailureOnSuccess(evt) {
            if (!isOurTarget(evt)) return;
            try { localStorage.removeItem(STORAGE_KEY); }
            catch (e) { /* ignore */ }
        }
        document.body.addEventListener('htmx:responseError', recordFailure);
        document.body.addEventListener('htmx:sendError', recordFailure);
        document.body.addEventListener('htmx:afterSwap', clearFailureOnSuccess);
    })();
    </script>

</body>
</html>
