---
# DEVELOPMENT ILLUSTRATION -- not phaze's production collector configuration.
# See the header of docker-compose.telemetry.example.yml. homelab owns the real one.
#
# What this file IS good for: it is the configuration the measured figures in
# docs/telemetry/metric-catalogue.md section 5 were taken against, so the
# Prometheus metric NAMES recorded there are the names this translation actually
# produces rather than a guess about the OTLP -> Prometheus naming rules.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bounded, so a burst of analyze pods cannot make the collector itself the
  # thing that falls over.
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  # The scrape surface. `resource_to_telemetry_conversion` is deliberately LEFT
  # OFF (its default): turning it on promotes every resource attribute to a
  # metric label, which would put `process.pid`, `host.name` and `k8s.pod.name`
  # -- all of them per-pod and therefore unbounded across an 11,428-file archive
  # -- onto every analysis series. phaze keeps those on SPANS for exactly this
  # reason (src/phaze/telemetry/bootstrap.py::_trace_resource_attributes).
  prometheus:
    endpoint: 0.0.0.0:8889
    # MEASURED, and it matters for phaze's shape of producer. The prometheus exporter drops
    # a series it has not seen an update for within `metric_expiration` (DEFAULT 5m), so an
    # analyze Job's final counters vanish from this endpoint five minutes after the pod
    # exits -- observed directly while building this: 203 phaze series at the scrape
    # endpoint, then zero, with the collector still healthy and the Prometheus target still
    # up. At a 15s scrape interval Prometheus still catches ~20 scrapes of the final value,
    # which is enough; raise this only if a scrape interval is long relative to it.
    # homelab owns the real value -- this is a development illustration.
    metric_expiration: 10m
    # service.name -> `job`, service.instance.id -> `instance`, and nothing else.
    resource_to_telemetry_conversion:
      enabled: false
  # THE TRACE DESTINATION. Before phaze-m1drf.8 the traces pipeline ended at `debug`, i.e.
  # phaze emitted a complete per-file trace and the collector printed a line and dropped it.
  # Emission was built in phaze-m1drf.1; the destination was never specified.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # `debug` stays alongside Tempo deliberately: it is what makes a "did anything arrive?"
      # question answerable from `docker logs` without opening a UI, which is the first thing
      # anyone wiring this up wants to know.
      exporters: [otlp/tempo, debug]
