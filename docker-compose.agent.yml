---
# docker-compose.agent.yml — file-server-host compose (Phase 29 D-15).
#
# Standalone file. The operator runs:
#   docker compose -f docker-compose.agent.yml up -d
# on a file server (no other compose file needed).
#
# Service split — only file-server-local services live here. All agent images are
# pulled from GHCR (published by docker-publish.yml).
#
# quick-260707-dh1 — per-lane worker split. The single shared SAQ worker is replaced
# by THREE lane workers (analyze/meta/io), ALL from the one agent image
# with the IDENTICAL command, differing ONLY by env (PHAZE_AGENT_LANE + its lane
# concurrency). This stops I/O offload + cheap analysis being head-of-line-blocked
# behind CPU-bound essentia backlog:
#   worker-analyze      — process_file (in-process essentia; CPU-bound). Heartbeat lives HERE.
#   worker-meta         — extract_file_metadata / scan_directory / execute_approved_batch,
#                         plus (phaze-6bkk) write_file_tags / write_cue_sheet / read_companion_files.
#   worker-io           — s3_upload / push_file (network-bound; off the CPU budget).
#   worker-drain        — OFF by default (profiles: ["drain"]): transitional all-mode consumer of
#                         the LEGACY un-suffixed `phaze-agent-nox` queue for the migration window.
#   watcher             — directory watcher (PHAZE_ROLE=agent). Pulls from GHCR.
#
# CPU budget: DERIVED, not pinned (phaze-rvcn). The analyze lane's concurrency and the
# extractor's TF intra-op cap are two halves of one relationship —
# `intra_op_threads x concurrency ~= physical_cores` — and phaze now computes both from the
# host's schedulable PHYSICAL core count in one place (services/analysis_sizing.py). On nox
# (8 physical) that is intra-op 4 x concurrency 2; on a 32-physical-core host it would be
# intra-op 4 x concurrency 8, with per-process peak RSS unchanged. Pinning either half here
# is what let them drift (they did: 1 x 4 = 4 of 8 cores), so the CPU lanes now pass the
# variables through only when the operator explicitly sets them.
# EVERY lane worker heartbeats (PHAZE_AGENT_HEARTBEAT=true on all three), each tagging its
# own lane (phaze-30fo). This REPLACES the former "exactly one heartbeat per agent, on
# worker-analyze" rule: that pinned the agent's whole liveness signal -- and its work-routing
# rank, via select_active_agent's ORDER BY last_seen_at DESC -- to a single process, so one
# stalled analyze worker marked the agent DEAD and cost it routing while its other lanes
# were busy. The control plane keeps max(last_seen) and a per-lane depth breakdown.
# worker-drain stays false: it is unlaned (all-mode), so its beat carries no lane tag.
#
# Media-mount access (phaze-6bkk, cross-ref phaze-mwvt / phaze-au0r). SCAN_PATH is mounted rw ONLY
# where the archive is actually mutated -- the meta lane, and the all-mode drain worker that also
# registers the meta functions. analyze / io / watcher stay READ-ONLY: essentia analysis, rsync/S3
# upload and the directory watcher only ever read, so least-privilege keeps a bug in any of them
# from touching the archive. The meta lane's rw requirement is not new with this bead --
# execute_approved_batch (the move stage) has always needed it, and phaze-mwvt / phaze-au0r track
# that every approved move failed EROFS against the previous ro mount -- but phaze-6bkk makes it
# load-bearing for two further surfaces (tag write and CUE generation), so it is fixed here.
#
# Invariants (asserted by tests/agents/deployment/test_agent_compose.py):
#   - No DATABASE_URL on any service (DIST-04: agents reach Postgres only via
#     the application server's HTTP API).
#   - No postgres or redis service here (agents connect to the app-server's).
#   - ${SCAN_PATH:?SCAN_PATH required} fail-fast on ALL services — docker compose up
#     errors at parse time on a misconfigured host (WARNING-2/-3).
#   - SCAN_PATH is rw on the meta + drain workers and ro everywhere else (phaze-6bkk).
#   - MODELS_PATH bind mount is rw on every worker + watcher (D-21 auto-download).
#   - Every worker + watcher pins container-side MODELS_PATH=/models in its own
#     `environment:` block (phaze-bvkah). MODELS_PATH is ALSO the compose bind-source var
#     (`${MODELS_PATH:-./models}` above) — one name serving two coordinate systems, a HOST
#     path for the bind mount and a CONTAINER path for src/phaze/config.py's `models_path`
#     field (env_file: .env injects the SAME host-side value into every container, and the
#     field has no alias, so an operator's HOST-side MODELS_PATH silently overrode the
#     container's fixed /models unless it happened to equal it — crash-looping every lane
#     worker with `PermissionError: mkdir '/app/models'` on the shipped `.env.example`
#     value of `./models`). Compose `environment:` wins over `env_file:`, so this line
#     re-pins the container reader to the fixed mount target regardless of what the
#     operator sets MODELS_PATH to on the host side.
#   - CA_PATH bind mount is ro everywhere (operator-distributed CA cert).
#
# Image tag pinning (D-16): default `latest` is convenient for first-time
# operators. Production should pin to a specific version tag via
# `PHAZE_IMAGE_TAG=2026.7.0` in .env. The docker-publish.yml workflow tags both
# `:latest` and `:<version>` on tagged releases (verified by
# test_docker_publish_workflow_tags_both_latest_and_version).

services:
  # --- quick-260707-dh1: three lane workers, one image, identical command, env-only difference ---
  worker-analyze:
    image: ghcr.io/simplicityguy/phaze:${PHAZE_IMAGE_TAG:-latest}
    command: uv run saq phaze.tasks.agent_worker.settings
    env_file: .env
    environment:
      - PHAZE_ROLE=agent
      - PHAZE_AGENT_LANE=analyze
      # phaze-rvcn: NO `:-4` default and NO thread pinning here any more. Both were literals, in
      # two different files, for the two halves of one relationship — and they had drifted:
      # concurrency 4 x intra-op 1 = 4 on a host with 8 physical cores, with the extractor parked
      # on the 1-thread arm measured at +210.6% wall for 0.001 GiB less than 4 threads
      # (`phaze-7i0k` §5). phaze now derives BOTH from the host's schedulable physical core count
      # in one place (`services/analysis_sizing.py`), so this bare name passes the variable through
      # ONLY when the operator actually sets it, and otherwise leaves the derived default in force.
      - PHAZE_LANE_ANALYZE_CONCURRENCY
      # phaze-30fo: every lane worker heartbeats (see the header block above) — this beat is tagged
      # lane=analyze; the dashboard's get_queue_activity remains the authoritative all-lane figure.
      - PHAZE_AGENT_HEARTBEAT=true
      # Same pass-through rule for the thread caps: set one and it wins (phaze never overwrites an
      # operator value); leave them unset and the derivation supplies min(4, physical_cores) / 1 /
      # min(4, physical_cores), which is what keeps peak RSS a property of the workload rather than
      # of the box this container happens to land on.
      - OMP_NUM_THREADS
      - TF_NUM_INTRAOP_THREADS
      - TF_NUM_INTEROP_THREADS
      # phaze-bvkah: pin the CONTAINER-side reader to the fixed mount target. MODELS_PATH is
      # also the HOST-side bind-source var below; `environment:` wins over `env_file: .env`,
      # so this stops the operator's host path from shadowing config.py's models_path field.
      - MODELS_PATH=/models
    volumes:
      - "${SCAN_PATH:?SCAN_PATH required}:/data/music:ro"
      - "${MODELS_PATH:-./models}:/models:rw"
      - "${CA_PATH:-./certs}:/certs:ro"
    restart: unless-stopped

  worker-meta:
    image: ghcr.io/simplicityguy/phaze:${PHAZE_IMAGE_TAG:-latest}
    command: uv run saq phaze.tasks.agent_worker.settings
    env_file: .env
    environment:
      - PHAZE_ROLE=agent
      - PHAZE_AGENT_LANE=meta
      - PHAZE_LANE_META_CONCURRENCY=${PHAZE_LANE_META_CONCURRENCY:-2}
      - PHAZE_AGENT_HEARTBEAT=true
      # phaze-bvkah: see worker-analyze above — pins the container-side reader to /models.
      - MODELS_PATH=/models
    volumes:
      # rw, NOT ro (phaze-6bkk; see the header note). Every meta-lane task that mutates the archive
      # lives behind this mount: execute_approved_batch (move/rename), write_file_tags (mutagen
      # save), write_cue_sheet (CUE write). A :ro mount here fails all three with EROFS.
      - "${SCAN_PATH:?SCAN_PATH required}:/data/music:rw"
      - "${MODELS_PATH:-./models}:/models:rw"
      - "${CA_PATH:-./certs}:/certs:ro"
    restart: unless-stopped

  worker-io:
    image: ghcr.io/simplicityguy/phaze:${PHAZE_IMAGE_TAG:-latest}
    command: uv run saq phaze.tasks.agent_worker.settings
    env_file: .env
    environment:
      - PHAZE_ROLE=agent
      - PHAZE_AGENT_LANE=io
      - PHAZE_LANE_IO_CONCURRENCY=${PHAZE_LANE_IO_CONCURRENCY:-4}
      - PHAZE_AGENT_HEARTBEAT=true
      # Network-bound (httpx multipart PUT + rsync-over-SSH): off the CPU budget, no thread pinning.
      # phaze-bvkah: see worker-analyze above — pins the container-side reader to /models.
      - MODELS_PATH=/models
    volumes:
      - "${SCAN_PATH:?SCAN_PATH required}:/data/music:ro"
      - "${MODELS_PATH:-./models}:/models:rw"
      - "${CA_PATH:-./certs}:/certs:ro"
    restart: unless-stopped

  # --- Transitional legacy-queue drain (quick-260707-dh1 migration; OFF by default) ---
  # Producers flip to the lane queues on deploy, so the legacy un-suffixed `phaze-agent-nox`
  # queue only DRAINS (never grows). This all-mode consumer (PHAZE_AGENT_LANE UNSET -> all
  # functions, base queue) finishes any in-flight legacy job IN PLACE, so a running multi-hour
  # process_file is NOT re-enqueued (no duplicate-active hazard). PHAZE_AGENT_HEARTBEAT=false
  # because this consumer is UNLANED: an untagged beat is persisted verbatim and would wipe
  # the per-lane `lanes` breakdown the three lane workers maintain (phaze-30fo). Bring it up
  # ONLY during the migration:
  #   docker compose -f docker-compose.agent.yml --profile drain up -d worker-drain
  # Remove it once `phaze-agent-nox` reports 0 queued + 0 active (see docs/agent-queue-lanes.md).
  worker-drain:
    image: ghcr.io/simplicityguy/phaze:${PHAZE_IMAGE_TAG:-latest}
    command: uv run saq phaze.tasks.agent_worker.settings
    profiles: ["drain"]
    env_file: .env
    environment:
      - PHAZE_ROLE=agent
      # PHAZE_AGENT_LANE intentionally UNSET -> all-mode: consumes the legacy base queue with all functions.
      - PHAZE_AGENT_HEARTBEAT=false
      # phaze-rvcn: pass-through, not pinned — see worker-analyze above for why.
      - OMP_NUM_THREADS
      - TF_NUM_INTRAOP_THREADS
      - TF_NUM_INTEROP_THREADS
      # phaze-bvkah: see worker-analyze above — pins the container-side reader to /models.
      - MODELS_PATH=/models
    volumes:
      # rw for the same reason as worker-meta: all-mode registers EVERY function, including the
      # three archive-mutating meta-lane tasks, so a :ro mount here silently fails legacy-queue
      # drain jobs that a lane worker would have completed.
      - "${SCAN_PATH:?SCAN_PATH required}:/data/music:rw"
      - "${MODELS_PATH:-./models}:/models:rw"
      - "${CA_PATH:-./certs}:/certs:ro"
    restart: unless-stopped

  watcher:
    image: ghcr.io/simplicityguy/phaze:${PHAZE_IMAGE_TAG:-latest}
    command: uv run python -m phaze.agent_watcher
    env_file: .env
    environment:
      - PHAZE_ROLE=agent
      # phaze-bvkah: see worker-analyze above — pins the container-side reader to /models.
      - MODELS_PATH=/models
    volumes:
      - "${SCAN_PATH:?SCAN_PATH required}:/data/music:ro"
      - "${MODELS_PATH:-./models}:/models:rw"
      - "${CA_PATH:-./certs}:/certs:ro"
    restart: unless-stopped
