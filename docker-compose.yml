---
# Application-server compose. Phase 29 hardening (D-05, D-17, D-19):
#   - Only the application-server services live here: {api, worker, postgres, redis}.
#   - The watcher and agent-worker services live in
#     docker-compose.agent.yml (deployed on the file server in Plan 04+).
#   - api + worker have NO music/model/output file mounts (DIST-01). The api
#     container only mounts ./certs/ so the cert bootstrap (Plan 01) can read
#     and write the auto-generated CA + leaf certificates.
#   - Redis is hardened per D-05: --requirepass with REDIS_PASSWORD env var
#     (fail-fast at compose-parse time), LAN-bound port via REDIS_BIND_IP,
#     and an authenticated healthcheck with --no-auth-warning.
services:
  api:
    # phaze-ewpa: auto-restart the control plane after a host reboot / daemon
    # restart / power blip, matching docker-compose.agent.yml and
    # docker-compose.cloud-agent.yml (which set this on every service). Without
    # it the whole app server (DB/cache/API/controller) stays down until a manual
    # `docker compose up -d` while the agent stacks auto-restart and hammer it.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m phaze.entrypoint
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      # phaze-hti8: Redis runs with `--requirepass ${REDIS_PASSWORD}` (below), so
      # every client MUST authenticate. `env_file` does NOT interpolate, so the
      # `.env` REDIS_URL cannot embed `${REDIS_PASSWORD}`; compose's `environment:`
      # block DOES interpolate at parse time.
      #
      # phaze-1g89i: this used to assemble the FULL authenticated DSN here --
      # `REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379/0` -- which broke on a
      # strong password containing `/`, `#`, or `?` (compose interpolates the raw byte
      # sequence into the URL string, and `redis.asyncio.Redis.from_url` then RFC-3986-parses
      # and percent-DECODES it, truncating the netloc) and silently corrupted one containing a
      # `%XX` sequence. Passing the RAW password through its own var instead lets
      # `config.py`'s `_apply_redis_password` percent-ENCODE it into `redis_url`'s userinfo in
      # Python, where the full byte string is still intact -- no shell/URL round-trip to
      # mangle it. Still fails fast at compose-parse time if unset, same as before.
      #
      # phaze-qu5ne (superseded by phaze-1g89i, see below): this line used to assemble the
      # full authenticated DSN under the bare `REDIS_URL` name, which `redis_url`'s
      # `AliasChoices("PHAZE_REDIS_URL", "REDIS_URL", "redis_url")` ranks BELOW an operator's
      # own `.env` `PHAZE_REDIS_URL` -- so a passwordless `.env` PHAZE_REDIS_URL silently
      # outranked and defeated this line, reintroducing NOAUTH. `_apply_redis_password`
      # (config.py) closes that gap as a side effect: it percent-encodes `redis_password`
      # into `redis_url`'s userinfo AFTER alias resolution, regardless of which alias won --
      # so the password lands correctly whether `redis_url` resolved from `PHAZE_REDIS_URL`,
      # `REDIS_URL`, or the field default. Verified by
      # tests/agents/deployment/test_api_filesystem_isolation.py::
      # test_compose_authenticated_redis_url_outranks_dotenv_alias.
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      # phaze-bvkah: the api service has NO models volume (DIST-01) but still reads
      # config.py's `models_path` field via `env_file: .env`, and that value is forwarded
      # VERBATIM to the agent as the model-load path in every process_file payload
      # (enqueue_process_file(..., cfg.models_path) in services/backends.py /
      # routers/pipeline.py). Leaving MODELS_PATH unset here lets the HOST-side compose bind
      # value (e.g. `./models`) leak into the payload, sending the agent a path relative to
      # ITS OWN filesystem that has nothing to do with the archive's actual bind mount.
      # Pinning it to the agent's fixed mount target keeps the payload correct regardless of
      # what the operator's `.env` MODELS_PATH resolves to on the host.
      - MODELS_PATH=/models
    # Backend execution registry (control-plane-only, ControlSettings) is declared in a
    # backends.toml mounted at PHAZE_BACKENDS_CONFIG_FILE (default /etc/phaze/backends.toml);
    # an absent file resolves to the zero-config implicit all-local registry (cloud off).
    # Mount a backends.toml to enable cloud backends.
    volumes:
      # ./certs/ is bind-mounted rw so phaze.cert_bootstrap can generate the
      # CA + leaf certificates on first start (idempotent on subsequent starts).
      - "${CA_PATH:-./certs}:/certs:rw"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Application-server worker -- control role (fileless SAQ tasks only).
  # Phase 29 D-17: the agent-side counterpart lives in docker-compose.agent.yml.
  # PHAZE_ROLE=control selects ControlSettings in phaze.config.get_settings().
  # No volume mounts: the controller is fileless and never touches SCAN_PATH,
  # MODELS_PATH, or OUTPUT_PATH (DIST-01).
  worker:
    restart: unless-stopped  # phaze-ewpa: control-role worker auto-restarts with the stack
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run saq phaze.tasks.controller.settings
    env_file: .env
    environment:
      - PHAZE_ROLE=control
      # phaze-1g89i: same safe REDIS_PASSWORD pass-through as the api service (see there for
      # why the DSN is no longer assembled here) — the control worker's before_enqueue/
      # after_process counter + rate-limit hooks read the same cache_redis handle, so it must
      # authenticate against the requirepass Redis or every hook raises NOAUTH on first use.
      # phaze-qu5ne (superseded by phaze-1g89i — see the api service's comment above):
      # _apply_redis_password closes the same alias-priority NOAUTH gap this bead reported,
      # regardless of which redis_url alias won.
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      # Backend execution registry (control-plane-only, ControlSettings) is declared in a
      # backends.toml mounted at PHAZE_BACKENDS_CONFIG_FILE (default /etc/phaze/backends.toml);
      # an absent file resolves to the zero-config implicit all-local registry (cloud off).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    restart: unless-stopped  # phaze-ewpa: DB must come back after a reboot/blip (pgdata persists)
    # phaze-tcqq: this is one of three places this exact tag is pinned (the justfile's
    # `postgres_image` variable, this file, and .github/workflows/tests.yml's service
    # container) -- Compose can't read a justfile variable, so this stays a literal pin.
    # tests/agents/deployment/test_postgres_image_pin.py mechanically asserts all three agree;
    # bump them together or the guard test fails and names the mismatch.
    image: postgres:18-alpine
    # phaze-rnh7 (D-05 / AUTH-03, mirrored from redis below): Postgres holds ALL of
    # the project's crown-jewel data (file metadata, proposals, tracklists, agent
    # token hashes), so it gets the SAME hardening as redis:
    #   - POSTGRES_PASSWORD uses `${VAR:?msg}` (fail-fast at compose-parse time) so an
    #     operator who forgets to set it errors instead of silently booting with a
    #     weak default the way `${VAR:-phaze}` did.
    #   - The published port is IP-prefixed and loopback by default; production
    #     overrides POSTGRES_BIND_IP to the app-server's LAN IP (e.g. 192.168.1.10)
    #     so agents on other hosts reach it, exactly like REDIS_BIND_IP. WITHOUT an
    #     explicit IP prefix docker binds 0.0.0.0 (all interfaces = whole LAN).
    # The api/worker containers reach Postgres via the compose-network hostname
    # `postgres:5432`, so the published host port is NOT needed for intra-stack traffic.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phaze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-phaze}
    # phaze-knwk: Docker's default /dev/shm is 64 MB, and Postgres's dynamic shared
    # memory (parallel query workers, parallel index builds) lives there -- exceed it
    # and the operation dies with "could not resize shared memory segment ... No space
    # left on device", a message that names disk while the fault is /dev/shm.
    #
    # Derivation (investigated phaze-knwk, no pgvector involved): this deployment does
    # not override maintenance_work_mem, so it stays at the image default of 64 MB --
    # exactly today's /dev/shm ceiling, i.e. already the "shm_size >= maintenance_work_mem"
    # floor the phaze-ytgo.6 spike measured for pgvector's HNSW builds, with ZERO margin.
    # A direct reproduction against an isolated 1,000,000-row analysis_window (~7.7x
    # production's current ~130,000 rows) showed ordinary Postgres operations already
    # reaching into that shared memory under this deployment's own default settings:
    #   - `CREATE INDEX` on analysis_window naturally invoked a parallel worker (no
    #     forcing) at that scale, though /dev/shm usage stayed negligible (~3 MB).
    #   - A `Parallel Hash Join` between files and analysis_window (forced parallel via
    #     zero setup/tuple cost, the planner's own cost model does not yet choose
    #     parallel for this shape at 1M rows) drove /dev/shm to 32 MB -- 51% of the 64 MB
    #     cap -- with default work_mem (4 MB) and max_parallel_workers_per_gather (2).
    # No failure was reproduced at production's actual current scale or at 7.7x it, so
    # stock phaze is NOT currently affected -- but the second measurement shows near-zero
    # headroom once the planner (or an operator tuning work_mem/maintenance_work_mem
    # upward for legitimate performance reasons) starts choosing parallel plans over a
    # growing analysis_window. 256 MB = 4x the default maintenance_work_mem ceiling and
    # 8x the single-operation high-water mark measured above, with headroom for the
    # several lane workers (analyze/meta/io) issuing queries concurrently.
    shm_size: "256m"
    volumes:
      # postgres:18+ stores data in a major-version-specific subdirectory under
      # /var/lib/postgresql to support pg_upgrade --link without mount-boundary
      # issues. Mount the parent dir (not /var/lib/postgresql/data).
      # See: https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phaze}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped  # phaze-ewpa: cache must come back with the stack after a reboot/blip
    image: redis:8-alpine
    # Phase 29 D-05 / AUTH-03: --requirepass with REDIS_PASSWORD interpolation
    # (`${VAR:?msg}` fails fast at compose-parse time if unset). The agent-side
    # half of AUTH-03 lives in AgentSettings._enforce_redis_password_in_production
    # (Plan 02): production agents reject passwordless redis_url.
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
    ports:
      # Bind to loopback in dev; production overrides REDIS_BIND_IP to the
      # app-server's LAN IP (e.g. 192.168.1.10) so agents on other hosts reach
      # it. WITHOUT an explicit IP prefix, docker binds to 0.0.0.0.
      - "${REDIS_BIND_IP:-127.0.0.1}:6379:6379"
    healthcheck:
      # --no-auth-warning suppresses redis-cli's stderr warning about passing
      # the password on the command line. The ping itself still requires auth.
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
