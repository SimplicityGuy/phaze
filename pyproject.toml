[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaze"
version = "2026.8.6"
description = "A music alignment tool"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Phase 53 (KSTAGE-01..05): async S3 client the control plane uses to presign multipart
    # PUT + just-in-time GET URLs and to delete/abort staged objects. The control plane never
    # reads file bytes (DIST-01); it only orchestrates presigned URLs the agent/pod transfer over.
    # aioboto3 stopped at aiobotocore 2.x, so use aiobotocore's native session API directly.
    "aiobotocore>=3.9.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.1",
    "essentia-tensorflow>=2.1b6.dev1438; sys_platform != 'linux' or platform_machine == 'x86_64'",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    # Phase 54 (KSUBMIT-01): control-plane Kubernetes client. Submits suspended Kueue Jobs
    # via the kube API, watches them to completion, and reconciles their status. Lives on the
    # control plane ONLY (kube creds never reach the agent/pod, mirroring aiobotocore). Verified
    # legitimate (kr8s-org, BSD-3-Clause, pure-Python) before install (T-54-SC).
    "kr8s>=0.20.15",
    # Capped on purpose: litellm had a supply-chain attack (malicious 1.82.7/1.82.8,
    # Mar 2026) and ships frequent breaking minors, so CLAUDE.md mandates aggressive
    # pinning. The cap confines uv to ONE vetted minor line; raise it deliberately.
    #
    # Raised 1.85.x -> 1.94.x on 2026-08-04 by operator decision, which is the "raise the
    # cap deliberately after vetting" step CLAUDE.md requires -- not an automatic bump.
    # Vetted at that raise: 1.94.1 is nine minors clear of the compromised 1.82.7/1.82.8,
    # pip-audit and osv-scanner report nothing against it, and the full suite passes. Note
    # this cap is now the ONLY control on this package: the repo-wide `exclude-newer`
    # cooldown was removed the same day, so there is no waiting window behind it.
    #
    # Raised 1.97.x -> 1.98.x on 2026-08-23, same deliberate step. This also requires the
    # aiobotocore 3.x migration above because litellm 1.98 requires boto3 >=1.43.1 while the
    # final aioboto3 release pins boto3 to the 1.40 line. Vetted at this raise: see the PR for
    # the pip-audit / osv-scanner / full-suite results.
    #
    # WHEN YOU RAISE THIS CAP, the raise is not complete until the guard moves with it.
    # tests/review/services/test_proposal_provider_wire_shapes.py measures the LLM->pydantic seam
    # against whatever litellm is pinned here and records that minor in MEASURED_LITELLM_MINOR.
    # Re-measure its verdicts and update that constant in the SAME commit as the bump. This comment
    # is a pointer, not a coupling -- nothing enforces it, and the cost of forgetting lands on
    # whoever gates next, ~23 minutes into a suite, in a file they did not touch (phaze-85zxu).
    "litellm>=1.98.0,<1.99.0",
    "lxml>=6.1.2",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    # phaze-m1drf.1: OpenTelemetry. THREE packages, deliberately -- api + sdk + the
    # OTLP **HTTP/protobuf** exporter. No `opentelemetry-instrumentation-*` package is
    # taken: phaze writes its own HTTP / SAQ / SQLAlchemy hooks so that every metric
    # LABEL is a bounded value this repo chose (see docs/telemetry/metric-catalogue.md).
    # Auto-instrumentation labels HTTP by the RAW path, which puts a file UUID in a
    # Prometheus label the first time anyone requests /record/<uuid> -- an unbounded
    # series explosion in a Prometheus phaze does not own (phaze-m1drf.3 §cardinality).
    #
    # HTTP/protobuf rather than gRPC on purpose: the gRPC exporter needs `grpcio` (a
    # heavy binary wheel that must build for every platform in the essentia/TF matrix)
    # and its channel keeps its own retry state across a shutdown, which is exactly the
    # blocking-at-exit shape phaze-m1drf.2 §2 has to bound for a k8s analyze Job.
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    # phaze-fq9h.1: 1001Tracklists detail pages deliver their track listing via JS behind a
    # Cloudflare Turnstile widget, and spike phaze-dmvs proved a HEADFUL Patchright (a
    # CDP-patched Playwright fork) is the only non-evasive client that clears it -- vanilla
    # Playwright headless AND Patchright headless both stall on the interstitial. This is
    # fingerprint MATCHING, not evasion: no proxies, no UA randomization, no CAPTCHA solver
    # (the epic's ethics bound). services/tracklist_render.py is the sole consumer.
    #
    # Capped to the minor line ON PURPOSE. Patchright pins an exact patched browser build and
    # `patchright install chrome` in the worker image (phaze-fq9h.5) must stay in lockstep with
    # the client; a floating minor silently desynchronizes image and client. Raise the cap
    # deliberately, rebuilding the image in the same change.
    #
    # Raised 1.61.x -> 1.62.x on 2026-08-18. The lockstep holds automatically: Dockerfile's
    # `python -m patchright install --with-deps chrome` runs from the venv this pin resolves,
    # so CI's docker-validate / docker-publish rebuild is what re-pairs image and client.
    "patchright>=1.62.1,<1.63.0",
    # v4.1.1 hotfix: saq[postgres] pulls bare `psycopg` (pure-Python), which needs a
    # libpq backend at import. The v4.1.0 slim image had none (no C ext, no binary
    # wheel, no system libpq) -> `ImportError: no pq wrapper available` crash-looped
    # phaze-api. `psycopg[binary]` bundles libpq (cp314 wheels exist for linux x86_64/
    # aarch64 + macos arm64); the Dockerfile also installs `libpq5` as a belt-and-
    # suspenders fallback for the pure-Python path.
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    # Direct dep since v4.0.1: config.py reads the configured `.env` for `<VAR>_FILE`
    # secret resolution. Already installed transitively via pydantic-settings' env_file
    # support; declared explicitly so the direct import is not a transitive accident.
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    # Phase 70 (MKUE-01): kube_staging parses inline kubeconfig YAML content into a dict for the
    # per-backend kr8s client. Already resolved transitively via the pinned kr8s -- declared
    # explicitly (hygiene) so a future kr8s dropping PyYAML cannot silently break the kubeconfig
    # parse. Floor at the currently-resolved 6.0.3.
    "PyYAML>=6.0.3",
    "rapidfuzz>=3.14.5",
    # Direct dep since Phase 36: dropping `saq[redis]` removes the transitive `redis`,
    # but `redis.asyncio` is imported directly across the codebase (cache_redis handle,
    # pipeline counters). Declared explicitly so the import is not a transitive accident.
    "redis>=8.1.0,<9.0",
    # Phase 36: postgres extra pulls psycopg[pool]>=3.3.4 for the PostgresQueue broker.
    "saq[postgres]>=0.26.4",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
    "watchdog>=6.0.0",
]

[project.scripts]
phaze = "phaze.cli:main"

# phaze-jktlb. WHERE the JSON report lands. Measured, not assumed (coverage 7.15.4 +
# pytest-cov 7.1.0): `--cov-report=json` with NO `:DEST` and a bare `coverage json` BOTH
# resolve their destination from this key -- pytest-cov's engine passes `outfile=None`
# straight through to coverage.py, which then reads the config. Verified by pointing this
# key at a sentinel filename and observing the artifact appear under that name.
#
# THE SPLIT THAT MATTERS, because it is the thing this bead got asked to establish:
# coverage.py owns the report's DESTINATION; pytest-cov owns whether the report is EMITTED
# at all. `--cov-report` is a pytest-cov flag with no coverage.py equivalent and no pytest
# ini key (the installed plugin registers eleven `addoption`s and zero `addini`s), so
# SELECTION cannot live here. It lives in the justfile's `cov_reports` variable. Do not
# "finish the job" by trying to move selection into this table -- there is nothing to move
# it to, and a key here that coverage.py ignores reads as configured while doing nothing.
#
# `scripts/coverage_floor.py` and `just branch-check` both read this path.
[tool.coverage.json]
output = "coverage.json"

[tool.coverage.report]
# phaze-bk9el.21 -- THIS NUMBER DID NOT CHANGE, BUT WHAT IT MEASURES DID. Read before editing.
#
# With `branch = true` set under the tool.coverage.run section below, coverage.py's `fail_under` measures the
# COMBINED figure -- `(covered_lines + covered_branches) / (num_statements + num_branches)` -- not
# lines. There is no coverage.py option to make it line-only (verified against coverage 7.15.4:
# `coverage report` offers --fail-under, --format and --precision, and nothing that selects the
# metric). `coverage xml`, `coverage json` and pytest-cov all read this same value.
#
# MEASURED on the full suite, 2026-08-21:
#     statements 17554/17771 = 98.7789%
#     branches    3684/3866  = 95.2923%
#     combined   21238/21637 = 98.1559%   <- what this key now checks
# 3.16 points of headroom, so this stays ARMED. It also has to: `just coverage-combine` passes
# `--fail-under=95` on the CLI, a CLI value silently overrides this config value, and
# `tests/shared/test_coverage_gate.py` fails the build if the two sites ever disagree.
#
# The operator's decision that the repo-wide gate stays on LINES at 95% is satisfied separately and
# explicitly by `scripts/coverage_floor.py`, which reads `percent_statements_covered` and enforces
# 95% repo-wide plus 90% per module. That separation is load-bearing at the per-module level: ONE
# module reads differently under the two metrics (`src/phaze/routers/duplicates.py` -- 91.20%
# statements, 75.00% branches, 88.59% combined), so a per-module floor left on the combined number
# would fail a module that has regressed nothing. Neither gate is disarmed; both name their metric.
fail_under = 95
precision = 2
show_missing = true

[tool.coverage.run]
# phaze-bk9el.21, operator decision 2026-08-21. Question as put: "Branch coverage is off, and
# runs 4-8 points under line coverage on the refactor targets. What should this epic do about
# it?" Answer as given (selected option label, verbatim): "Enable it, gate the refactor targets
# only (Recommended)". Durable record: bead phaze-bk9el.21.
#
# ON REPO-WIDE, GATE-NARROW. `branch = true` makes every coverage run in this repo MEASURE
# branches, so the number is visible everywhere. It deliberately does NOT move the repo-wide
# gate onto branches: branch coverage runs below the line figure on most files, so a repo-wide
# branch gate would fail on day one and the backfill would dwarf the epic it was meant to
# protect. The repo-wide floors stay on LINES -- see scripts/coverage_floor.py, which is now
# where BOTH of them are enforced, and its header for why that had to move.
#
# WHY IT MATTERS AT ALL: decomposing a long function, flattening a nest, or splitting a file
# are all operations where every line still executes and only the BRANCH COMBINATIONS change.
# Line coverage is structurally unable to detect the regression a refactor is most likely to
# introduce, which is exactly the change class epic phaze-bk9el consists of.
branch = true
concurrency = ["greenlet", "thread"]
omit = ["tests/*"]
relative_files = true
source = ["phaze"]

# phaze-jktlb. WHERE the Cobertura report lands -- the companion to the json table above, and
# established by the same measurement: `--cov-report=xml` with no `:DEST`, and the bare
# `coverage xml` that `just coverage-combine` runs, both take their destination from here.
# This retired the `-o coverage.xml` that scripts/repowise-coverage.sh used to hardcode.
#
# Codecov reads this file (.github/workflows/tests.yml `files: ./coverage.xml`), so the path
# is also pinned there and in scripts/repowise_coverage_gate.py's `--coverage-xml`. Cobertura
# cannot carry per-test contexts; the binary `.coverage` is the only artifact that can, which
# is why `--cov-context=test` stays on the shard recipes rather than moving into config.
[tool.coverage.xml]
output = "coverage.xml"

[tool.hatch.build.targets.wheel]
packages = ["src/phaze"]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = "^(tests/|prototype/|services/|vulture_whitelist\\.py)"
mypy_path = ["src"]
no_implicit_optional = true
python_version = "3.14"
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["essentia", "essentia.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mutagen", "mutagen.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiobotocore.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# PyYAML ships no py.typed / stubs bundled; kube_staging parses inline kubeconfig content via yaml.safe_load.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# Playwright is pinned in the `browser` dependency group for the real-browser test suite and
# scripts/analyze_browser_soak.py. It is not a runtime project dependency; production uses the
# separately pinned Patchright package below.
#
# SUPERSEDED IN PART (phaze-fq9h.1, 2026-08-02): the "zero-new-dependencies" constraint this
# comment used to cite as the reason NO browser automation library could be a real dependency was
# a per-milestone constraint, and the operator retired it for epic phaze-fq9h. Patchright IS now a
# pinned real dependency (see [project].dependencies) because the 1001Tracklists render path
# cannot work without a browser at runtime, in production, on a worker -- an `uv run --with`
# invocation cannot serve that. Do not re-litigate this as an accidental dependency; the ephemeral
# boundary survives because Playwright remains isolated to a development-only dependency group.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# Patchright ships no py.typed marker, so mypy cannot see through `patchright.async_api` even
# though the package is fully annotated upstream (it is a Playwright fork and mirrors its API).
# services/tracklist_render.py declares its own structural Protocols for the browser boundary, so
# the untyped import is confined to one lazily-imported factory function.
[[tool.mypy.overrides]]
module = ["patchright", "patchright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "phaze.services.agent_client"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "phaze.services.agent_task_router"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (database, redis, etc.)",
    "browser: real-browser Playwright tests (phaze-tzy6s.14). Excluded from the default run by `addopts`; run with `just test-browser`.",
]
# phaze-tzy6s.14: the browser suite is deselected by DEFAULT, not merely un-run by convention.
# Playwright is isolated to the optional `browser` dependency group (only Patchright is a runtime
# dependency -- see the mypy override comment below), so a default `uv sync` does not install it.
# `-m browser` on the command line overrides this, which is what `just test-browser` passes.
addopts = "-m 'not browser'"
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py313"
# Do not format fenced code blocks in markdown. ruff 0.16 began formatting them, which would
# rewrite 217 committed docs (214 under .planning/, 3 under docs/) purely to normalise comment
# spacing inside illustrative snippets.
#
# This is the same decision `[tool.ruff.format] docstring-code-format = false` already records:
# embedded samples are PROSE, and their layout is often the point -- an aligned trailing comment
# marking the line a write-up is about, or a deliberately terse fragment that is not valid
# standalone module text. Reformatting them edits documentation to satisfy a code formatter.
#
# Nothing gated this (`just lint` is `ruff check`; the pre-commit ruff-format hook is Python-only),
# so it never failed CI -- but a bare `uv run ruff format` by anyone churned 217 files. Excluding
# markdown makes that impossible rather than merely unlikely.
extend-exclude = ["*.md"]

[tool.ruff.format]
docstring-code-format = false
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "E501",  # line too long, handled by ruff format
    "S101",  # use of assert detected (allow assert statements)
]
select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PLC",  # pylint conventions
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "S",    # bandit security rules
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (no print statements)
    "TCH",  # flake8-type-checking
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "W191", # indentation contains tabs (explicit tab detection)
]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["phaze"]
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/parity/**" = ["T201"]
# Spike measurement harnesses. These are standalone, manually-run scripts whose ENTIRE output is
# what they print -- they are the evidence a spike doc cites, not library code (see
# docs/spikes/phaze-han03-essentia-seek.md). Same rationale as scripts/parity/**.
"docs/spikes/**" = ["T201"]
"services/**" = ["S603", "S607"]
"src/phaze/cli/**" = ["T201"]
"src/phaze/main.py" = ["T201"]
"tests/**" = ["T201", "PLC", "S105", "ARG001"]

[tool.uv]
# nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
# NO dependency cooldown. Operator decision 2026-08-03: resolve every package at its latest
# published version rather than deferring adoption.
#
# What this gives up, stated so nobody has to reconstruct it: a cooldown exists so a compromised
# release has time to be detected and yanked before it can enter a lockfile. This repo has already
# been on the receiving end of that class -- litellm is pinned `>=1.98.0,<1.99.0` because of the
# March 2026 supply-chain attack on 1.82.7/1.82.8. With no window, a malicious release published
# minutes ago is eligible the moment `uv lock` runs.
#
# The compensating controls that remain: pip-audit, osv-scanner, bandit and Trivy all run in CI on
# every PR, and `uv.lock` pins exact versions with hashes, so nothing changes without a reviewed
# lockfile diff. Those catch KNOWN-bad releases; they do not catch a fresh one in its first hours,
# which is precisely what the cooldown covered.
#
# The semgrep suppression above is deliberate and paired with this decision -- the rule hardcodes
# a 7-day recommendation, so it cannot express "no cooldown, knowingly". Re-adding a window means
# deleting the nosemgrep line, restoring `exclude-newer`, and re-raising COOLDOWN_DAYS in
# scripts/update-project.sh (which re-asserts it across manifests).
environments = [
    # Only support Linux platforms that we build for in CI/CD
    "sys_platform == 'linux' and platform_machine == 'x86_64'",   # linux/amd64
    "sys_platform == 'linux' and platform_machine == 'aarch64'",  # linux/arm64
    # Also support local development on macOS
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",  # macOS Intel
    "sys_platform == 'darwin' and platform_machine == 'arm64'",   # macOS Apple Silicon
]
constraint-dependencies = [
    # setuptools 82.0.1 carries PYSEC-2026-3447 (macOS APFS/HFS+ NFD filename bypasses an NFC
    # MANIFEST.in exclude when packing an sdist); fixed in 83.0.0 (published 2026-07-04, already
    # past the 2-day cooldown). setuptools is only a transitive test dependency (via moto), so
    # floor it here to keep pip-audit clean without promoting it to a direct dependency.
    "setuptools>=83.0.0",
]

[dependency-groups]
browser = [
    "playwright==1.62.0",
]
dev = [
    "bandit>=1.9.4",
    "defusedxml>=0.7.1",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    # phaze-frq98 (seam F1): validates `kube_staging.build_job_manifest`'s output against the REAL
    # Kubernetes Job schema -- the vendored, OpenAPI-derived artifact under
    # `tests/vendor/kubernetes-json-schema/`, which is the SAME artifact `kubeconform` consumes.
    # Chosen over kubeconform deliberately: kubeconform IS a JSON-Schema validator over these files,
    # so a Go binary in CI *and* on every dev machine buys nothing the schema does not already carry
    # (and it would still need the schemas vendored for offline determinism). A pure-Python dev
    # dependency needs no dev-side setup step at all -- `uv sync` already installs this group.
    # NOTE: no JSON Schema catches a bad Quantity ("4GB", "500") -- k8s types those as plain strings.
    # That is `services/k8s_quantity.py`'s job, at config load, and it is ADR-0012 G3 in miniature:
    # this schema is DERIVED FROM the same OpenAPI the apiserver publishes, so validating against it
    # proves the manifest's shape and says nothing about what the apiserver's own Quantity parser --
    # the real consumer -- will accept. See ADR-0012 section 4, G3
    # (`docs/design/0012-verification-fidelity-and-operator-attribution.md`).
    "jsonschema>=4.26.0",
    # Phase 53: S3 mock so the staging leg (presign/upload/delete) is testable without a
    # live S3 backend or cluster. The [server] extra (flask/werkzeug) provides
    # ThreadedMotoServer -- required because aiobotocore's async response parsing
    # is incompatible with moto's in-process `mock_aws`, so the SDK must talk real HTTP to a
    # wire-compatible moto server (this is what makes presigned-URL round-trips testable).
    "moto[server]>=5.2.3",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "types-defusedxml>=0.7.0.20260504",
    "vulture>=2.16",
]
