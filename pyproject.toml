[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaze"
version = "2026.7.11"
description = "A music alignment tool"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Phase 53 (KSTAGE-01..05): async S3 client the control plane uses to presign multipart
    # PUT + just-in-time GET URLs and to delete/abort staged objects. The control plane never
    # reads file bytes (DIST-01); it only orchestrates presigned URLs the agent/pod transfer over.
    "aioboto3>=15.5.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.0",
    "essentia-tensorflow>=2.1b6.dev1438; sys_platform != 'linux' or platform_machine == 'x86_64'",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    # Phase 54 (KSUBMIT-01): control-plane Kubernetes client. Submits suspended Kueue Jobs
    # via the kube API, watches them to completion, and reconciles their status. Lives on the
    # control plane ONLY (kube creds never reach the agent/pod, mirroring aioboto3). Verified
    # legitimate (kr8s-org, BSD-3-Clause, pure-Python) before install (T-54-SC).
    "kr8s>=0.20.15",
    # Capped on purpose: litellm had a supply-chain attack (malicious 1.82.7/1.82.8,
    # Mar 2026) and ships frequent breaking minors, so CLAUDE.md mandates aggressive
    # pinning. The cap confines uv to ONE vetted minor line; raise it deliberately.
    #
    # Raised 1.85.x -> 1.94.x on 2026-08-04 by operator decision, which is the "raise the
    # cap deliberately after vetting" step CLAUDE.md requires -- not an automatic bump.
    # Vetted at that raise: 1.94.1 is nine minors clear of the compromised 1.82.7/1.82.8,
    # pip-audit and osv-scanner report nothing against it, and the full suite passes. Note
    # this cap is now the ONLY control on this package: the repo-wide `exclude-newer`
    # cooldown was removed the same day, so there is no waiting window behind it.
    "litellm>=1.94.1,<1.95.0",
    "lxml>=6.1.1",
    "mutagen>=1.48.1",
    "numpy>=2.5.1",
    # phaze-fq9h.1: 1001Tracklists detail pages deliver their track listing via JS behind a
    # Cloudflare Turnstile widget, and spike phaze-dmvs proved a HEADFUL Patchright (a
    # CDP-patched Playwright fork) is the only non-evasive client that clears it -- vanilla
    # Playwright headless AND Patchright headless both stall on the interstitial. This is
    # fingerprint MATCHING, not evasion: no proxies, no UA randomization, no CAPTCHA solver
    # (the epic's ethics bound). services/tracklist_render.py is the sole consumer.
    #
    # Capped to the minor line ON PURPOSE. Patchright pins an exact patched browser build and
    # `patchright install chrome` in the worker image (phaze-fq9h.5) must stay in lockstep with
    # the client; a floating minor silently desynchronizes image and client. Raise the cap
    # deliberately, rebuilding the image in the same change.
    "patchright>=1.61.2,<1.62.0",
    # v4.1.1 hotfix: saq[postgres] pulls bare `psycopg` (pure-Python), which needs a
    # libpq backend at import. The v4.1.0 slim image had none (no C ext, no binary
    # wheel, no system libpq) -> `ImportError: no pq wrapper available` crash-looped
    # phaze-api. `psycopg[binary]` bundles libpq (cp314 wheels exist for linux x86_64/
    # aarch64 + macos arm64); the Dockerfile also installs `libpq5` as a belt-and-
    # suspenders fallback for the pure-Python path.
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    # Direct dep since v4.0.1: config.py reads the configured `.env` for `<VAR>_FILE`
    # secret resolution. Already installed transitively via pydantic-settings' env_file
    # support; declared explicitly so the direct import is not a transitive accident.
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    # Phase 70 (MKUE-01): kube_staging parses inline kubeconfig YAML content into a dict for the
    # per-backend kr8s client. Already resolved transitively via the pinned kr8s -- declared
    # explicitly (hygiene) so a future kr8s dropping PyYAML cannot silently break the kubeconfig
    # parse. Floor at the currently-resolved 6.0.3.
    "PyYAML>=6.0.3",
    "rapidfuzz>=3.14.5",
    # Direct dep since Phase 36: dropping `saq[redis]` removes the transitive `redis`,
    # but `redis.asyncio` is imported directly across the codebase (cache_redis handle,
    # pipeline counters). Declared explicitly so the import is not a transitive accident.
    "redis>=8.1.0,<9.0",
    # Phase 36: postgres extra pulls psycopg[pool]>=3.3.4 for the PostgresQueue broker.
    "saq[postgres]>=0.26.4",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.6",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.1",
    "watchdog>=6.0.0",
]

[project.scripts]
phaze = "phaze.cli:main"

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
omit = ["tests/*"]
relative_files = true
source = ["phaze"]

[tool.hatch.build.targets.wheel]
packages = ["src/phaze"]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = "^(tests/|prototype/|services/|vulture_whitelist\\.py)"
mypy_path = ["src"]
no_implicit_optional = true
python_version = "3.14"
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["essentia", "essentia.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mutagen", "mutagen.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aioboto3", "aiobotocore.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# PyYAML ships no py.typed / stubs bundled; kube_staging parses inline kubeconfig content via yaml.safe_load.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# Playwright ITSELF is still never a project dependency (ephemeral `uv run --with playwright`)
# -- scripts/analyze_browser_soak.py (Phase 95, phaze-zqvh.5) is the sole consumer, run manually
# against a live dev instance, never in CI.
#
# SUPERSEDED IN PART (phaze-fq9h.1, 2026-08-02): the "zero-new-dependencies" constraint this
# comment used to cite as the reason NO browser automation library could be a real dependency was
# a per-milestone constraint, and the operator retired it for epic phaze-fq9h. Patchright IS now a
# pinned real dependency (see [project].dependencies) because the 1001Tracklists render path
# cannot work without a browser at runtime, in production, on a worker -- an `uv run --with`
# invocation cannot serve that. Do not re-litigate this as an accidental dependency; the ephemeral
# rule survives only for the manual soak script above.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# Patchright ships no py.typed marker, so mypy cannot see through `patchright.async_api` even
# though the package is fully annotated upstream (it is a Playwright fork and mirrors its API).
# services/tracklist_render.py declares its own structural Protocols for the browser boundary, so
# the untyped import is confined to one lazily-imported factory function.
[[tool.mypy.overrides]]
module = ["patchright", "patchright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "phaze.services.agent_client"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "phaze.services.agent_task_router"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (database, redis, etc.)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py313"
# Do not format fenced code blocks in markdown. ruff 0.16 began formatting them, which would
# rewrite 217 committed docs (214 under .planning/, 3 under docs/) purely to normalise comment
# spacing inside illustrative snippets.
#
# This is the same decision `[tool.ruff.format] docstring-code-format = false` already records:
# embedded samples are PROSE, and their layout is often the point -- an aligned trailing comment
# marking the line a write-up is about, or a deliberately terse fragment that is not valid
# standalone module text. Reformatting them edits documentation to satisfy a code formatter.
#
# Nothing gated this (`just lint` is `ruff check`; the pre-commit ruff-format hook is Python-only),
# so it never failed CI -- but a bare `uv run ruff format` by anyone churned 217 files. Excluding
# markdown makes that impossible rather than merely unlikely.
extend-exclude = ["*.md"]

[tool.ruff.format]
docstring-code-format = false
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "E501",  # line too long, handled by ruff format
    "S101",  # use of assert detected (allow assert statements)
]
select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PLC",  # pylint conventions
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "S",    # bandit security rules
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (no print statements)
    "TCH",  # flake8-type-checking
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "W191", # indentation contains tabs (explicit tab detection)
]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["phaze"]
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/parity/**" = ["T201"]
"services/**" = ["S603", "S607"]
"src/phaze/cli/**" = ["T201"]
"src/phaze/main.py" = ["T201"]
"tests/**" = ["T201", "PLC", "S105", "ARG001"]

[tool.uv]
# nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
# NO dependency cooldown. Operator decision 2026-08-03: resolve every package at its latest
# published version rather than deferring adoption.
#
# What this gives up, stated so nobody has to reconstruct it: a cooldown exists so a compromised
# release has time to be detected and yanked before it can enter a lockfile. This repo has already
# been on the receiving end of that class -- litellm is pinned `>=1.85.7,<1.86.0` because of the
# March 2026 supply-chain attack on 1.82.7/1.82.8. With no window, a malicious release published
# minutes ago is eligible the moment `uv lock` runs.
#
# The compensating controls that remain: pip-audit, osv-scanner, bandit and Trivy all run in CI on
# every PR, and `uv.lock` pins exact versions with hashes, so nothing changes without a reviewed
# lockfile diff. Those catch KNOWN-bad releases; they do not catch a fresh one in its first hours,
# which is precisely what the cooldown covered.
#
# The semgrep suppression above is deliberate and paired with this decision -- the rule hardcodes
# a 7-day recommendation, so it cannot express "no cooldown, knowingly". Re-adding a window means
# deleting the nosemgrep line, restoring `exclude-newer`, and re-raising COOLDOWN_DAYS in
# scripts/update-project.sh (which re-asserts it across manifests).
environments = [
    # Only support Linux platforms that we build for in CI/CD
    "sys_platform == 'linux' and platform_machine == 'x86_64'",   # linux/amd64
    "sys_platform == 'linux' and platform_machine == 'aarch64'",  # linux/arm64
    # Also support local development on macOS
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",  # macOS Intel
    "sys_platform == 'darwin' and platform_machine == 'arm64'",   # macOS Apple Silicon
]
constraint-dependencies = [
    # setuptools 82.0.1 carries PYSEC-2026-3447 (macOS APFS/HFS+ NFD filename bypasses an NFC
    # MANIFEST.in exclude when packing an sdist); fixed in 83.0.0 (published 2026-07-04, already
    # past the 2-day cooldown). setuptools is only a transitive test dependency (via moto), so
    # floor it here to keep pip-audit clean without promoting it to a direct dependency.
    "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    # Phase 53: S3 mock so the staging leg (presign/upload/delete) is testable without a
    # live S3 backend or cluster. The [server] extra (flask/werkzeug) provides
    # ThreadedMotoServer -- required because aioboto3/aiobotocore's async response parsing
    # is incompatible with moto's in-process `mock_aws`, so the SDK must talk real HTTP to a
    # wire-compatible moto server (this is what makes presigned-URL round-trips testable).
    "moto[server]>=5.2.2",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
    "vulture>=2.16",
]
