---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        # The vendored Kubernetes JSON schemas are 683 KB of upstream artifact (phaze-frq98) --
        # over the 500 KB default, and deliberately NOT minified: the whole point of a vendored
        # schema is that `curl ... | shasum -a 256` re-verifies it byte for byte against upstream.
        exclude: |
          (?x)^(
            \.planning/graphs/graph\.json|
            \.planning/graphs/\.last-build-snapshot\.json|
            graphify-out/graph\.json|
            tests/vendor/kubernetes-json-schema/.*\.json
          )$
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags like GitHub Actions
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
        # Don't reformat vendored third-party assets — must stay byte-identical
        # to the audited upstream build (see static/vendor/ and base.html).
        # Same rule, different reason, for the recorded 1001Tracklists renders
        # (phaze-fq9h.1): they are EVIDENCE of what the live site served, and each
        # one cost a request from a budget of one per 8 seconds. Whitespace-fixing
        # them would quietly edit the record the detail parser is developed against.
        # Same rule again for the `git format-patch` series under docs/spikes/*/patches/
        # (phaze-han03): a patch file is a CHECKSUMMED-BY-CONTEXT format. Diff context
        # lines legitimately carry trailing whitespace and the trailer ends "-- ", so
        # stripping either makes `git am` fail to apply — verified, it did.
        # Same rule once more for the vendored Kubernetes JSON schemas (phaze-frq98,
        # tests/vendor/): they are the upstream `yannh/kubernetes-json-schema` artifacts, checked
        # against a recorded sha256, and they ship with NO trailing newline -- so this hook WOULD
        # rewrite them and break that check.
        exclude: &byte-identical ^(src/phaze/static/vendor/|tests/identify/fixtures/tracklist_render/|docs/spikes/[^/]+/patches/|tests/vendor/)
      - id: mixed-line-ending
        exclude: *byte-identical
      - id: trailing-whitespace
        exclude: *byte-identical
      - id: pretty-format-json
        args: [--autofix, --indent=2]
        # Skip generated artifacts (planning graphs, graphify output) and the byte-identical
        # vendored Kubernetes JSON schemas (tests/vendor/, phaze-frq98) -- reformatting an upstream
        # artifact destroys the sha256 that proves it IS the upstream artifact.
        exclude: ^(\.planning/|graphify-out/|tests/vendor/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        args: [-x, "tests,services", -s, B608]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: c4654a7e007c9619a5eb63c39a456572a0fa1851  # frozen: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions

  # This hook is a `system` hook -- it lints with whatever `hadolint` is on PATH, so this rev pins
  # the hook DEFINITION and not the binary. `.github/workflows/code-quality.yml` installs the actual
  # tool and MUST name the same version; the two drifting apart is phaze-b67d, which reddened every
  # PR for ten hours. Bump both together or not at all.
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # frozen: v2.15.1
    hooks:
      - id: hadolint

  # NOTE: docker-compose-check (IamTheFij/docker-pre-commit) is intentionally
  # omitted — phaze's docker-compose.yml requires runtime secrets (REDIS_PASSWORD,
  # no default) that aren't available in a lint context, so `docker compose
  # config` cannot interpolate it. The CI docker-validate workflow covers compose.

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--shell=bash, --severity=warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb  # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--indent=2, --case-indent, --language-dialect=bash, --write]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
      - id: template-attr-quotes
        name: template attribute-quote lint (phaze-e1zby)
        description: >-
          Catches a literal `"` that would silently truncate a double-quoted Alpine/htmx
          directive attribute (x-data, x-on:*, @*, :*, x-show, x-if, hx-on:*, hx-vals, ...) --
          see scripts/lint_template_attr_quotes.py for the full mechanism and its limits.
        entry: uv run python scripts/lint_template_attr_quotes.py
        language: system
        files: ^src/phaze/templates/.*\.html$
