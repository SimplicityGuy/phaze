---
version: 2
updates:
  # GitHub Actions dependencies
  # No cooldown -- deliberate, paired with [tool.uv] in pyproject.toml; the rationale and the
  # controls that remain live there. Do not re-add here without restoring it there too.
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "SimplicityGuy"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images
  # No cooldown -- deliberate, paired with [tool.uv] in pyproject.toml; the rationale and the
  # controls that remain live there. Do not re-add here without restoring it there too.
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "SimplicityGuy"
    ignore:
      # The Python base image is a PROJECT CONSTRAINT, not a dependency to auto-bump.
      # CLAUDE.md fixes the runtime at 3.14, and `scripts/update-project.sh --python VERSION`
      # is the deliberate path that moves it across every manifest at once.
      #
      # Dockerfile.agent-arm64 additionally CANNOT move: it builds essentia from source against
      # the aarch64 `tensorflow` wheel, and TensorFlow publishes no cp314 aarch64 build. PR #326
      # proposed 3.14 there and the arm64 image failed to build ("No matching distribution found
      # for tensorflow==2.20.0"). Dependabot cannot see that constraint and reopened it weekly.
      #
      # Ignores match on dependency name, not filename, so this covers both Dockerfiles. That is
      # acceptable: neither should move on a bot's schedule.
      - dependency-name: "python"
    groups:
      docker-images:
        patterns:
          - "*"

  # Python dependencies (uv/pip)
  # No cooldown -- deliberate, paired with [tool.uv] in pyproject.toml; the rationale and the
  # controls that remain live there. Do not re-add here without restoring it there too.
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "SimplicityGuy"
    open-pull-requests-limit: 10
    groups:
      python-production:
        dependency-type: "production"
        patterns:
          - "*"
      python-development:
        dependency-type: "development"
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
