---
name: Code Quality

on:
  workflow_call:

env:
  CI: true
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          save-cache: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      # PINNED, and it must stay pinned (phaze-b67d, recurred once already as phaze-ny3du).
      # The `hadolint` pre-commit hook is a `system` hook: it lints with whatever `hadolint` is on
      # PATH, so `.pre-commit-config.yaml`'s frozen SHA pins the hook DEFINITION and not the
      # binary. `hadolint: latest` here therefore defeated that pin entirely -- CI silently ran an
      # unpinned linter, and when 2.15.0 shipped on 2026-07-30 it promoted DL3066 and reddened
      # every open PR while a local `pre-commit run --all-files` stayed green against 2.14.0.
      #
      # Keep this version equal to the hadolint release that `.pre-commit-config.yaml`'s frozen rev
      # corresponds to (currently v2.15.1 / 2eece55); bump BOTH together or the two disagree again.
      # tests/shared/test_hadolint_version_pin.py is the mechanical guard for this invariant --
      # it failed silent once already (phaze-ny3du: a pre-commit rev bump to v2.15.1 left this
      # step on v2.15.0 for an entire dependency-refresh cycle with no test catching it).
      - name: 🔧 Install hadolint
        uses: alexellis/arkade-get@5594ddff52ec7b8a71efd73acaa9e52936e35e16  # master (Node 24)
        with:
          hadolint: v2.15.1  # arkade uses this verbatim as the release tag -- the `v` is required

      # phaze-q78v2: a dependabot PR that bumps only pyproject.toml's version
      # constraints is not lock-synced by construction -- `uv lock` never runs as
      # part of the dependency-bump commit. Left unchecked, the FIRST `uv` command
      # that touches the lock (here, `just setup`'s `uv sync`) silently rewrites
      # uv.lock to match and leaves the working tree dirty, which disarms
      # `check-fast`'s git-diff-based test selector on every subsequent bead until
      # someone notices and commits the drift (phaze-q78v2, dependabot PR #553 /
      # merge 6a127599). Running the check BEFORE `just setup` is load-bearing: it
      # must fail loudly on the stale lock, not be silently satisfied by a sync
      # that already fixed it. tests/shared/test_uv_lock_check_gate.py pins both
      # the step and its position.
      - name: 🔒 Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: 📦 Install dependencies
        run: just setup

      - name: 🧪 Run pre-commit hooks
        run: just pre-commit

      # phaze-jjjy8: promtool is the REAL consumer of alerts/phaze-alerts.yml and its unit
      # tests (alerts/phaze-alerts.test.yml) -- see tests/shared/telemetry/test_alert_rules.py's
      # module docstring. `just alerts-test` loudly SKIPS when promtool is absent, which is
      # right for a local dev machine but wrong for CI: this step installs the binary so CI
      # always runs the real check rather than exercising the skip path.
      #
      # PINNED to v3.10.0 -- the SAME tag that docstring's `docker run` reproduce command
      # already names, so a local `docker run ... prom/prometheus:v3.10.0` and this CI
      # installation test against identical promtool behavior. Downloaded directly from
      # prometheus/prometheus's GitHub releases (the asset-name pattern is stable and has
      # been for years); no arkade-get entry is assumed for it, unlike hadolint above.
      - name: 🔔 Install promtool
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 300 \
            -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.10.0/prometheus-3.10.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 /tmp/prometheus-3.10.0.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

      - name: 🔔 Run alert rule unit tests (promtool test rules)
        run: just alerts-test
