---
name: Code Quality

on:
  workflow_call:

env:
  CI: true
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # frozen: v8.3.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      # PINNED, and it must stay pinned (phaze-b67d). The `hadolint` pre-commit hook is a `system`
      # hook: it lints with whatever `hadolint` is on PATH, so `.pre-commit-config.yaml`'s frozen
      # SHA pins the hook DEFINITION and not the binary. `hadolint: latest` here therefore defeated
      # that pin entirely -- CI silently ran an unpinned linter. When 2.15.0 shipped on 2026-07-30
      # it promoted DL3066 and every open PR went red on two pre-existing `USER phaze` lines, with
      # a local `pre-commit run --all-files` still green against 2.14.0.
      #
      # Keep this version equal to the hadolint release that `.pre-commit-config.yaml`'s frozen rev
      # corresponds to; bump BOTH together or the two disagree again.
      - name: 🔧 Install hadolint
        uses: alexellis/arkade-get@1eef818e467c387d3f50cfe0d2c565d1cbe82b03  # master
        with:
          hadolint: v2.14.0  # arkade uses this verbatim as the release tag -- the `v` is required

      - name: 📦 Install dependencies
        run: just install

      - name: 🧪 Run pre-commit hooks
        run: just pre-commit
