---
name: Security

on:
  workflow_call:
    inputs:
      code-changed:
        description: >-
          Whether non-documentation files changed. Gates the code-focused
          scanners (bandit/pip-audit/osv-scanner, semgrep, trivy) so they
          keep skipping on docs-only changes. secret-scanning ignores this
          input and always runs -- prose files are the highest-probability
          carrier of a pasted credential (phaze-84ca).
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.code-changed
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 🔍 Run pip-audit
        run: just pip-audit

      - name: 🛡️ Run bandit
        run: just security

      - name: 🌐 Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8

  semgrep:
    name: Semgrep CE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    if: inputs.code-changed && github.actor != 'dependabot[bot]'
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔬 Run semgrep scan
        run: >-
          semgrep scan --config auto --error
          --sarif --output semgrep.sarif

      - name: 🧹 Remove nosemgrep-suppressed findings
        run: |
          python3 - <<'EOF'
          import json
          with open("semgrep.sarif") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              run["results"] = [
                  r for r in run.get("results", [])
                  if not r.get("suppressions")
              ]
          with open("semgrep.sarif", "w") as f:
              json.dump(sarif, f)
          EOF
        if: always()

      - name: 📤 Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
        with:
          sarif_file: semgrep.sarif
        if: always()

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately no `if: inputs.code-changed` gate (phaze-84ca): prose files
    # (docs/**, *.md, .planning/**) are the highest-probability carrier of a
    # pasted generic credential, and GitHub's non-provider secret-scanning
    # patterns are disabled on this repo, so this is the only detective
    # control for that class. Always run, regardless of the docs-only path
    # filter that gates the rest of this workflow.
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔑 Run TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # frozen: v3.95.9
        with:
          path: ./
          extra_args: --only-verified

  container-scanning:
    name: Container Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.code-changed
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🛡️ Run trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: 📤 Upload trivy SARIF results
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
