---
name: Security

on:
  workflow_call:
    inputs:
      code-changed:
        description: >-
          Whether non-documentation files changed. Gates the code-focused
          scanners (bandit/pip-audit/osv-scanner, semgrep, trivy) so they
          keep skipping on docs-only changes. secret-scanning ignores this
          input and always runs -- prose files are the highest-probability
          carrier of a pasted credential (phaze-84ca).
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.code-changed
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 🔍 Run pip-audit
        run: just pip-audit

      - name: 🛡️ Run bandit
        run: just security

      - name: 🌐 Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1

  semgrep:
    name: Semgrep CE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # PINNED, and it must stay pinned (phaze-0qctk, same class of incident as
      # phaze-b67d's hadolint drift). Every other tool in this CI is frozen to an exact
      # version (every `uses:` is a 40-hex SHA; TruffleHog carries `# frozen: vX.Y.Z`
      # below) -- semgrep was the one unpinned executable, resolving to whatever
      # `semgrep/semgrep` last published on Docker Hub. A new engine release can promote
      # a new default rule or change match/severity behavior and redden every open PR
      # (including docs-only ones, since --error fails the job on any finding) with zero
      # repo change, irreproducibly (no local semgrep runs in pre-commit to catch it
      # first). Bump this deliberately, matching the frozen-SHA policy for every other
      # scanner -- never let it float back to a bare tag.
      #
      # Digest resolved from the semgrep/semgrep:1.173.0 manifest index (linux/amd64 +
      # linux/arm64) via the Docker Hub registry v2 API, 2026-08-17.
      image: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a  # frozen: v1.173.0
    if: inputs.code-changed && github.actor != 'dependabot[bot]'
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `--config auto` is a SECOND floating axis, independent of the engine pin above:
      # it resolves the ruleset from the semgrep.dev registry over the network at scan
      # time, so a digest-pinned engine still gets whatever ruleset the registry serves
      # that morning -- a newly-promoted default rule reddens CI identically either way.
      # Accepted as a known, documented risk rather than fixed here: pinning to a
      # committed ruleset snapshot (`--config .semgrep.yml`) is real future work but is
      # a materially larger change (vetting + maintaining an in-repo ruleset) than this
      # bead's scope (phaze-0qctk pins the engine only).
      - name: 🔬 Run semgrep scan
        run: >-
          semgrep scan --config auto --error
          --sarif --output semgrep.sarif

      - name: 🧹 Remove nosemgrep-suppressed findings
        run: |
          python3 - <<'EOF'
          import json
          with open("semgrep.sarif") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              run["results"] = [
                  r for r in run.get("results", [])
                  if not r.get("suppressions")
              ]
          with open("semgrep.sarif", "w") as f:
              json.dump(sarif, f)
          EOF
        if: always()

      - name: 📤 Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: semgrep.sarif
        if: always()

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately no `if: inputs.code-changed` gate (phaze-84ca): prose files
    # (docs/**, *.md, .planning/**) are the highest-probability carrier of a
    # pasted generic credential, and GitHub's non-provider secret-scanning
    # patterns are disabled on this repo, so this is the only detective
    # control for that class. Always run, regardless of the docs-only path
    # filter that gates the rest of this workflow.
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔑 Run TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # frozen: v3.97.0
        with:
          path: ./
          # Lob is excluded because its detector matches pytest function names, not secrets.
          # A Lob test key is `test_<alphanumerics>` -- which is also the shape of every test
          # this repo writes, so the detector fires on names like
          # `test_a_blank_override_is_not_an_override` and
          # `test_is_allowed_url_allows_the_apex_host`. It reports them as `verified: true`,
          # which is the detector's validation being wrong rather than a live credential:
          # reproduced locally against the full branch, every hit is a def name in tests/.
          # Costs no real coverage -- phaze has no Lob dependency, import, or account
          # (Lob is a direct-mail API). Revisit if that ever changes.
          extra_args: --only-verified --exclude-detectors=Lob

  container-scanning:
    name: Container Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.code-changed
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🛡️ Run trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: 📤 Upload trivy SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        if: always()
        with:
          sarif_file: trivy-results.sarif
