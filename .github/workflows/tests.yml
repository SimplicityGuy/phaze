---
name: Tests

on:
  workflow_call:

env:
  CI: true
  PYTHON_VERSION: "3.14"

  # phaze-m3qte: the ffmpeg CI toolchain, pinned. Change the version HERE and nowhere else.
  #
  # THESE THREE VALUES NAME ONE BUILD AND MUST BE UPDATED TOGETHER. Bumping FFMPEG_VERSION
  # alone leaves the tag and checksum pointing at the old asset -- the download would still
  # succeed and still verify, and CI would keep running the previous binary while the file
  # claims otherwise. That silent-wrong-version outcome is worse than an outright failure, so
  # treat the block as one unit:
  #
  #   1. pick a dated tag from https://github.com/BtbN/FFmpeg-Builds/releases (never `latest`,
  #      which is mutable and whose asset names contain the literal word "latest")
  #   2. copy the exact linux64-gpl asset name from that release
  #   3. sha256sum the downloaded file and paste it below
  #
  # FFMPEG_VERSION is the upstream release branch and is documentation for the reader; the TAG
  # and ASSET are what actually resolve, and the checksum is what makes it safe.
  #
  # CACHED, and the cache key is what makes a version bump safe. The key contains the RELEASE
  # TAG and the ASSET NAME, so a bumped version resolves to a different key and simply misses --
  # a stale entry from the previous version can never be served. There is deliberately NO
  # `restore-keys` prefix fallback: a partial match is exactly the failure this design must not
  # have, because it would hand back a DIFFERENT build under the new version's name. A miss
  # costs one 126 MB download; a wrong hit costs a silently wrong toolchain.
  FFMPEG_VERSION: "8.1"
  FFMPEG_RELEASE_TAG: "autobuild-2026-08-17-13-05"
  FFMPEG_ASSET: "ffmpeg-n8.1.2-44-g7c533d0f86-linux64-gpl-8.1.tar.xz"
  FFMPEG_SHA256: "802a6ad62d310814a42c4aea4a95354f4a5e04bd3e792c4ca55970d25577808b"

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.buckets.outputs.buckets }}
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # phaze-crq9k: tests/ci_shards.json is the CI matrix source (each entry a
      # {name, paths} shard), distinct from tests/buckets.json (the 8 fixed top-level
      # tests/<bucket> directory names the partition guard and BUCKETS.md track). A
      # shard's `paths` can split ONE bucket directory into several parallel matrix
      # legs -- see the durations comment on the `test` job below for why.
      - name: 🪣 Read CI shard list
        id: buckets
        run: echo "buckets=$(jq -c . tests/ci_shards.json)" >> "${GITHUB_OUTPUT}"

  # phaze-crq9k (2026-08-11): measured per-bucket wall time on PR #417 before this split:
  #   analyze 551s <- critical path, shared 301s, review 159s, agents 142s, identify 127s,
  #   integration 112s, discovery 92s, metadata 61s (total ~1,545s across 8 jobs; flat mean
  #   ~193s, so analyze ran ~2.9x and shared ~1.6x the mean).
  #
  # analyze and shared were each split into multiple tests/ci_shards.json entries, chosen
  # from local `pytest --durations=0` timings on this snapshot and scaled to the CI numbers
  # above (~3.05-3.1x the local machine):
  #   - analyze-core   ~151s  tests/analyze --ignore=tests/analyze/services (core, models,
  #                            routers, tasks dirs + the 3 tests/analyze/*.py root files)
  #   - analyze-svc-pipeline ~200s  tests/analyze/services/pipeline/ (the analysis-exec test
  #                            files: test_analysis*.py minus test_analysis_model_major.py)
  #   - analyze-svc-backends ~200s  tests/analyze/services/backends/ (compute-backend /
  #                            cloud-staging / queue-introspection test files) -- services/
  #                            alone was ~68% of analyze's wall time, so it was physically
  #                            split into these two subdirectories rather than left whole
  #   - shared-core    ~144s  tests/shared/core (its largest single directory)
  #   - shared-rest    ~157s  tests/shared --ignore=tests/shared/core (every other
  #                            tests/shared/* subdirectory PLUS the tests/shared/*.py
  #                            root-level files -- `--ignore` rather than an enumerated
  #                            subdirectory list so a new subdirectory or root file added
  #                            later is never silently dropped from CI)
  # New matrix mean ~140s; every shard stays within ~1.5x of it. Re-measure and re-split
  # when a shard's wall time drifts back above that -- this imbalance recurs as the suite
  # grows.
  test:
    name: Tests (${{ matrix.bucket.name }})
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.setup.outputs.buckets) }}
    services:
      # phaze-tcqq: GitHub Actions service containers can only REFERENCE a published
      # image -- they have no `build:` equivalent, unlike docker-compose.yml's postgres
      # service. This pin must therefore always resolve to a publicly pullable tag. If
      # production's Postgres ever becomes a custom build (e.g. the pgvector adoption
      # gated on the phaze-ytgo verdict matrix), this pin cannot follow it in place; it
      # would first need the custom image published to GHCR (phaze already does this for
      # the app image via `just image-push`) and repointed here. Kept in step with the
      # justfile's `postgres_image` variable and docker-compose.yml's `image:` by
      # tests/agents/deployment/test_postgres_image_pin.py -- bump all three together.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phaze
          POSTGRES_PASSWORD: phaze
          POSTGRES_DB: phaze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phaze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_test
      # Phase 36: the live-broker queue tests derive the raw libpq PostgresQueue DSN from
      # TEST_DATABASE_URL (stripping the +asyncpg dialect). Without it they fall back to a
      # nonexistent "phaze" DB — test_pg_* skip on the connect probe, but the agent-task-router
      # enqueue tests have no probe and PoolTimeout after 30s. Point the broker at the running
      # phaze_test service so SAQ's connect() auto-creates saq_jobs and the suite runs for real.
      TEST_DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_test
      # Pinned EXPLICITLY rather than left to the conftest default (which targets the local
      # `just test` harness on 5433). CI's service container publishes 5432, and the
      # "Create migrations test database" step below provisions phaze_migrations_test there.
      # Before this was explicit, CI silently depended on the default happening to match its
      # own port -- so changing that default for local dev would have broken CI with an
      # InvalidPasswordError that looks nothing like a port mismatch.
      MIGRATIONS_TEST_DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_migrations_test
      PHAZE_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # phaze-b4u3p: tests/review/services/test_review_refactor_parity.py reads the
          # pre-refactor services/review.py from git history (`git show <sha>:<path>`) to
          # assert the decomposition preserved behavior. The default `fetch-depth: 1`
          # clone does not contain that object, so the whole module errored in the
          # `review` shard while passing locally against a full clone.
          fetch-depth: 0

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # phaze-m3qte: keyed on the RELEASE TAG + ASSET NAME, so a version bump lands on a new key
      # and misses cleanly. No `restore-keys`: a prefix fallback would serve the PREVIOUS build
      # under the new version's name, which is the one outcome this pinning exists to prevent.
      # The cached payload is the two binaries, not the tarball -- nothing has to be unpacked on
      # a hit, and the 126 MB download is skipped entirely on 12 of the 13 shards.
      - name: 🎬 Restore the pinned ffmpeg binaries
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-${{ env.FFMPEG_RELEASE_TAG }}-${{ env.FFMPEG_ASSET }}

      - name: 🎬 Install ffmpeg
        # phaze-l832u: `analysis.py::_probe_duration_sec` shells out to `ffprobe` (D-10), so the
        # analysis path now needs the BINARY, not just essentia's bundled decode libraries. Before
        # D-10 the probe was `es.MetadataReader` (in-process), which is why no CI job ever
        # installed ffmpeg and why the runtime images -- which have shipped it since phaze-3ea41
        # for `video_audio.py`'s extraction -- were the only place it was needed. Without this
        # step, every real-audio test in the analyze-svc-pipeline shard fails with
        # `AnalysisProbeError: ffprobe could not be run`. Installed for ALL shards rather than
        # gated to that one: the probe is reachable from any test that analyzes real audio, and a
        # per-shard gate would silently re-break the moment a real-audio test moves shard.
        #
        # Deliberately NOT solved by falling back to MetadataReader when ffprobe is missing --
        # that fallback returns 0 for Matroska, which is the exact defect this bead fixed. A host
        # without ffmpeg must fail loudly.
        #
        # phaze-m3qte: apt is NOT the source any more. `apt-get install ffmpeg` resolves an
        # 87-package / 62.8 MB closure from azure.archive.ubuntu.com, and when that mirror
        # degrades the whole job dies before a single test runs. Measured on run 32084625278:
        # three shards red, ALL NINE install attempts killed by their timeout (exit 124) with
        # zero apt error output -- apt never refused, it was just too slow. Before any bound
        # existed the same condition hung past the job timeout and the job was cancelled with
        # the test steps SKIPPED, which reads as "the tests are timing out" when no test ever
        # ran. Across 13 shards that cost roughly two hours of wall clock per run.
        #
        # This step now downloads ONE pinned tarball (~126 MB, single file, single host) and
        # unpacks two static binaries from it. No package manager, no dependency closure, no
        # mirror.
        #
        # VERSION: 8.1, via the FFMPEG_* workflow env block at the top of this file -- bumping
        # it is a one-line edit there. Note the operator's deployment runs 7.1.5, so CI is a
        # major version AHEAD of production here; that gap is deliberate and known, because
        # BtbN/FFmpeg-Builds publishes only master, n8.1 and n9.0 -- 7.x is EOL upstream and no
        # n7.1 asset exists in any of its releases (checked back ~10 months of autobuild tags).
        # The previous apt path installed 6.1.1, i.e. CI was already a major version BEHIND
        # production and silently so. See phaze-m3qte; phaze-b62ri owns the image side.
        #
        # THE TAG IS PINNED, NOT `latest`. BtbN's `latest` release is mutable and its asset
        # names carry the literal string "latest", so pinning there would silently change the
        # binary under a fixed checksum. A dated autobuild tag is immutable and its asset name
        # carries the exact build (n8.1.2-44-g7c533d0f86). FFMPEG_SHA256 belongs to THAT asset:
        # the three FFMPEG_* values move together or not at all, and the checksum is verified
        # before anything is unpacked. A mismatch is a hard failure, never a retry.
        run: |
          set -euo pipefail
          if command -v ffprobe >/dev/null 2>&1; then
            echo "ffprobe already present: $(ffprobe -version | head -1)"
            exit 0
          fi

          # Cache hit: the binaries are already the pinned build, because the key names the tag
          # and the asset. Install and skip the network entirely.
          if [ -x "${HOME}/ffmpeg-bin/ffprobe" ] && [ -x "${HOME}/ffmpeg-bin/ffmpeg" ]; then
            echo "restored from cache: ffmpeg-${FFMPEG_RELEASE_TAG}-${FFMPEG_ASSET}"
            sudo install -m 0755 "${HOME}/ffmpeg-bin/ffmpeg" /usr/local/bin/ffmpeg
            sudo install -m 0755 "${HOME}/ffmpeg-bin/ffprobe" /usr/local/bin/ffprobe
            ffmpeg -version | head -1
            ffprobe -version | head -1
            exit 0
          fi

          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE_TAG}/${FFMPEG_ASSET}"
          echo "::group::download ${FFMPEG_ASSET}"
          started=${SECONDS}
          if ! curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 -o /tmp/ffmpeg.tar.xz "${url}"; then
            status=$?
            echo "::endgroup::"
            echo "::error::INFRASTRUCTURE -- could not download ffmpeg after $(( SECONDS - started ))s (curl exit ${status}); no test has run." >&2
            echo "This is not a test failure. Source: ${url}" >&2
            exit 1
          fi
          echo "::endgroup::"
          echo "downloaded in $(( SECONDS - started ))s"

          echo "${FFMPEG_SHA256}  /tmp/ffmpeg.tar.xz" | sha256sum -c - || {
            echo "::error::CHECKSUM MISMATCH for ${FFMPEG_ASSET}." >&2
            echo "Expected ${FFMPEG_SHA256}, got $(sha256sum /tmp/ffmpeg.tar.xz | cut -d' ' -f1)." >&2
            echo "The FFMPEG_* env values must be updated together -- tag, asset and checksum name ONE build." >&2
            exit 1
          }

          if ! tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
            echo "::error::could not unpack ${FFMPEG_ASSET} -- the archive verified but is not usable." >&2
            exit 1
          fi
          # Populate the cache directory from the VERIFIED extraction, then install from it, so
          # the bytes that get cached are the same bytes this run is about to use.
          mkdir -p "${HOME}/ffmpeg-bin"
          install -m 0755 "/tmp/${FFMPEG_ASSET%.tar.xz}/bin/ffmpeg" "${HOME}/ffmpeg-bin/ffmpeg"
          install -m 0755 "/tmp/${FFMPEG_ASSET%.tar.xz}/bin/ffprobe" "${HOME}/ffmpeg-bin/ffprobe"
          sudo install -m 0755 "${HOME}/ffmpeg-bin/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 0755 "${HOME}/ffmpeg-bin/ffprobe" /usr/local/bin/ffprobe
          rm -rf /tmp/ffmpeg.tar.xz "/tmp/${FFMPEG_ASSET%.tar.xz}"

          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: 🐘 Create migrations test database
        env:
          PGPASSWORD: phaze
        run: |
          psql -h localhost -U phaze -d postgres -c 'CREATE DATABASE phaze_migrations_test OWNER phaze;'

      - name: 📦 Install dependencies
        run: just install

      - name: 🧪 Run shard tests with coverage
        # Every shard contains DB-fixture (integration-marked) tests — verified empirically at
        # execution: `pytest <paths> -m integration --collect-only` returns >0 for all shards.
        # So no shard qualifies for `-n auto` (xdist would race on schema create/drop against
        # the shared phaze_test DB). All shards run serial; matrix fan-out alone delivers
        # CI-02's parallelism. If a future shard becomes DB-free, add a matrix.include entry
        # passing a third `-n auto` arg here.
        run: just test-bucket ${{ matrix.bucket.name }} "${{ matrix.bucket.paths }}"

      - name: 📤 Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.bucket.name }}
          path: .coverage.${{ matrix.bucket.name }}
          include-hidden-files: true
          if-no-files-found: error

  combine:
    name: Combine coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 📥 Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: 🧮 Combine coverage and enforce gate
        run: just coverage-combine

      # CI never ingests into repowise: its runner-local .repowise index would be discarded.
      # Export both halves instead so a report downloaded at this exact commit remains usable:
      # .coverage carries per-test contexts; Cobertura carries per-file line totals. The durable
      # local index is refreshed directly with `just repowise-coverage <isolated-seat-name>`.
      - name: 📤 Upload combined coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-combined
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          flags: unittests
          disable_search: true
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # phaze-tzy6s.14: the real-browser suite. Its own job on purpose, and NON-BLOCKING to start with
  # (`continue-on-error`), per the bead's "separate job, not blocking the unit matrix initially".
  # A brand-new browser suite has no flake record; gating merges on it before that record exists
  # would train everyone to re-run CI on red, which is exactly how a real failure gets waved
  # through. Promote it to blocking once it has a clean run of 10 (tracked on phaze-8p1uq).
  #
  # phaze-8p1uq: the record and the promotion procedure live in tests/browser/FLAKE_RECORD.md.
  # Status there is 0 of 10 -- this job cannot accumulate post-merge runs until epic phaze-tzy6s
  # merges to main, so the count starts then. Record each run in that file rather than deciding
  # from memory; the file also lists what to suspect first when a CI-only failure appears.
  browser:
    name: Browser contract (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phaze
          POSTGRES_PASSWORD: phaze
          POSTGRES_DB: phaze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phaze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # The harness derives the app's own database by appending `_browser` to this name, so it
      # never shares a database with the unit matrix (whose conftest drops the schema at teardown).
      TEST_DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_test
      PHAZE_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      # phaze-ldvmy: Playwright is an exact uv lock input. Resolve that locked version for a cache
      # key that also distinguishes runner architecture and the smaller headless-shell payload.
      # The browser toolchain can now change only through a reviewed pyproject/uv.lock diff.
      - name: 🎭 Resolve the playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(uv run --group browser playwright --version | awk '{print $2}')"
          if [ -z "${version}" ]; then
            echo "::error::could not resolve the playwright version; refusing to cache under an empty key." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "playwright ${version}"

      - name: 🎭 Restore the Chromium build
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-headless-shell

      - name: 🎭 Install the Chromium build
        env:
          CACHE_HIT: ${{ steps.chromium-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "Chromium cache hit: ${CACHE_HIT}"
          set +e
          timeout --kill-after=5s 300 just test-browser-install-ci
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            if [ "${status}" -eq 124 ]; then
              echo "::error::INFRASTRUCTURE -- the pinned Chromium download did not complete within 300s; no test has run." >&2
              echo "### 🚧 Browser job: pinned Chromium download timed out after 300s (cache hit: ${CACHE_HIT})" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "::error::the pinned Chromium install failed with exit ${status}; no test has run." >&2
              echo "### ❌ Browser job: Chromium install failed (exit ${status}, cache hit: ${CACHE_HIT})" >> "${GITHUB_STEP_SUMMARY}"
            fi
            exit "${status}"
          fi

      - name: 🎭 Verify Chromium launches
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=5s 30 uv run --group browser python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              print(f"Chromium {browser.version} launched successfully")
              browser.close()
          PY
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::INFRASTRUCTURE -- pinned Chromium failed its 30s launch smoke check (exit ${status}); no test has run." >&2
            echo "### ❌ Browser job: Chromium launch smoke failed (exit ${status})" >> "${GITHUB_STEP_SUMMARY}"
            exit "${status}"
          fi

      - name: 🌐 Run the browser contract suite
        # `just test-browser` depends on `tailwind`: without the compiled app.css the app serves an
        # unstyled page, and every layout assertion (drawer visibility, horizontal overflow) passes
        # vacuously. A browser suite with no CSS is worse than no browser suite.
        run: just test-browser

      # phaze-17ni3: before this step, a failing test here left nothing behind but the pytest
      # assertion text in the log -- the trace, screenshot-equivalent DOM snapshots and network log
      # that `tests/browser/conftest.py` now captures on failure (see its "CI diagnosability"
      # section) never left the runner. `test-results/traces/` is empty on a fully green run (the
      # suite discards a passing test's trace rather than saving it -- retain-on-failure, not
      # always-on), which is why `if-no-files-found` is `ignore` rather than `warn`/`error`.
      #
      # `!cancelled()` rather than `failure()`: a run that hits the job's 20-minute timeout is
      # CANCELLED, not FAILED, and that is precisely when the evidence matters most -- whichever
      # test was mid-flight when the timeout fired is the one nobody could otherwise diagnose.
      # `always()` would additionally re-run this after an infrastructure failure further up (the
      # Chromium install steps above), where `test-results/` cannot exist; `if-no-files-found:
      # ignore` covers that case too rather than needing a second condition.
      #
      # Retention is 14 days, chosen deliberately rather than left at the repo/org default: long
      # enough to cover the promotion window this job is on (FLAKE_RECORD.md's 10-consecutive-green
      # bar), short enough that a suite with real, if rare, failures does not accumulate zip files
      # indefinitely.
      - name: 📤 Upload browser test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
