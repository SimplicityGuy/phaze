---
name: Tests

on:
  workflow_call:

env:
  CI: true
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.buckets.outputs.buckets }}
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # phaze-crq9k: tests/ci_shards.json is the CI matrix source (each entry a
      # {name, paths} shard), distinct from tests/buckets.json (the 8 fixed top-level
      # tests/<bucket> directory names the partition guard and BUCKETS.md track). A
      # shard's `paths` can split ONE bucket directory into several parallel matrix
      # legs -- see the durations comment on the `test` job below for why.
      - name: 🪣 Read CI shard list
        id: buckets
        run: echo "buckets=$(jq -c . tests/ci_shards.json)" >> "${GITHUB_OUTPUT}"

  # phaze-crq9k (2026-08-11): measured per-bucket wall time on PR #417 before this split:
  #   analyze 551s <- critical path, shared 301s, review 159s, agents 142s, identify 127s,
  #   integration 112s, discovery 92s, metadata 61s (total ~1,545s across 8 jobs; flat mean
  #   ~193s, so analyze ran ~2.9x and shared ~1.6x the mean).
  #
  # analyze and shared were each split into multiple tests/ci_shards.json entries, chosen
  # from local `pytest --durations=0` timings on this snapshot and scaled to the CI numbers
  # above (~3.05-3.1x the local machine):
  #   - analyze-core   ~151s  tests/analyze --ignore=tests/analyze/services (core, models,
  #                            routers, tasks dirs + the 3 tests/analyze/*.py root files)
  #   - analyze-svc-pipeline ~200s  tests/analyze/services/pipeline/ (the analysis-exec test
  #                            files: test_analysis*.py minus test_analysis_model_major.py)
  #   - analyze-svc-backends ~200s  tests/analyze/services/backends/ (compute-backend /
  #                            cloud-staging / queue-introspection test files) -- services/
  #                            alone was ~68% of analyze's wall time, so it was physically
  #                            split into these two subdirectories rather than left whole
  #   - shared-core    ~144s  tests/shared/core (its largest single directory)
  #   - shared-rest    ~157s  tests/shared --ignore=tests/shared/core (every other
  #                            tests/shared/* subdirectory PLUS the tests/shared/*.py
  #                            root-level files -- `--ignore` rather than an enumerated
  #                            subdirectory list so a new subdirectory or root file added
  #                            later is never silently dropped from CI)
  # New matrix mean ~140s; every shard stays within ~1.5x of it. Re-measure and re-split
  # when a shard's wall time drifts back above that -- this imbalance recurs as the suite
  # grows.
  test:
    name: Tests (${{ matrix.bucket.name }})
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.setup.outputs.buckets) }}
    services:
      # phaze-tcqq: GitHub Actions service containers can only REFERENCE a published
      # image -- they have no `build:` equivalent, unlike docker-compose.yml's postgres
      # service. This pin must therefore always resolve to a publicly pullable tag. If
      # production's Postgres ever becomes a custom build (e.g. the pgvector adoption
      # gated on the phaze-ytgo verdict matrix), this pin cannot follow it in place; it
      # would first need the custom image published to GHCR (phaze already does this for
      # the app image via `just image-push`) and repointed here. Kept in step with the
      # justfile's `postgres_image` variable and docker-compose.yml's `image:` by
      # tests/agents/deployment/test_postgres_image_pin.py -- bump all three together.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phaze
          POSTGRES_PASSWORD: phaze
          POSTGRES_DB: phaze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phaze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_test
      # Phase 36: the live-broker queue tests derive the raw libpq PostgresQueue DSN from
      # TEST_DATABASE_URL (stripping the +asyncpg dialect). Without it they fall back to a
      # nonexistent "phaze" DB — test_pg_* skip on the connect probe, but the agent-task-router
      # enqueue tests have no probe and PoolTimeout after 30s. Point the broker at the running
      # phaze_test service so SAQ's connect() auto-creates saq_jobs and the suite runs for real.
      TEST_DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_test
      # Pinned EXPLICITLY rather than left to the conftest default (which targets the local
      # `just test` harness on 5433). CI's service container publishes 5432, and the
      # "Create migrations test database" step below provisions phaze_migrations_test there.
      # Before this was explicit, CI silently depended on the default happening to match its
      # own port -- so changing that default for local dev would have broken CI with an
      # InvalidPasswordError that looks nothing like a port mismatch.
      MIGRATIONS_TEST_DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_migrations_test
      PHAZE_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎬 Install ffmpeg
        # phaze-l832u: `analysis.py::_probe_duration_sec` shells out to `ffprobe` (D-10), so the
        # analysis path now needs the BINARY, not just essentia's bundled decode libraries. Before
        # D-10 the probe was `es.MetadataReader` (in-process), which is why no CI job ever
        # installed ffmpeg and why the runtime images -- which have shipped it since phaze-3ea41
        # for `video_audio.py`'s extraction -- were the only place it was needed. Without this
        # step, every real-audio test in the analyze-svc-pipeline shard fails with
        # `AnalysisProbeError: ffprobe could not be run`. Installed for ALL shards rather than
        # gated to that one: the probe is reachable from any test that analyzes real audio, and a
        # per-shard gate would silently re-break the moment a real-audio test moves shard.
        #
        # Deliberately NOT solved by falling back to MetadataReader when ffprobe is missing --
        # that fallback returns 0 for Matroska, which is the exact defect this bead fixed. A host
        # without ffmpeg must fail loudly.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 🐘 Create migrations test database
        env:
          PGPASSWORD: phaze
        run: |
          psql -h localhost -U phaze -d postgres -c 'CREATE DATABASE phaze_migrations_test OWNER phaze;'

      - name: 📦 Install dependencies
        run: just install

      - name: 🧪 Run shard tests with coverage
        # Every shard contains DB-fixture (integration-marked) tests — verified empirically at
        # execution: `pytest <paths> -m integration --collect-only` returns >0 for all shards.
        # So no shard qualifies for `-n auto` (xdist would race on schema create/drop against
        # the shared phaze_test DB). All shards run serial; matrix fan-out alone delivers
        # CI-02's parallelism. If a future shard becomes DB-free, add a matrix.include entry
        # passing a third `-n auto` arg here.
        run: just test-bucket ${{ matrix.bucket.name }} "${{ matrix.bucket.paths }}"

      - name: 📤 Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.bucket.name }}
          path: .coverage.${{ matrix.bucket.name }}
          include-hidden-files: true
          if-no-files-found: error

  combine:
    name: Combine coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 📥 Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: 🧮 Combine coverage and enforce gate
        run: just coverage-combine

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          flags: unittests
          disable_search: true
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # phaze-tzy6s.14: the real-browser suite. Its own job on purpose, and NON-BLOCKING to start with
  # (`continue-on-error`), per the bead's "separate job, not blocking the unit matrix initially".
  # A brand-new browser suite has no flake record; gating merges on it before that record exists
  # would train everyone to re-run CI on red, which is exactly how a real failure gets waved
  # through. Promote it to blocking once it has a clean run of 10 (tracked on phaze-8p1uq).
  #
  # phaze-8p1uq: the record and the promotion procedure live in tests/browser/FLAKE_RECORD.md.
  # Status there is 0 of 10 -- this job cannot accumulate post-merge runs until epic phaze-tzy6s
  # merges to main, so the count starts then. Record each run in that file rather than deciding
  # from memory; the file also lists what to suspect first when a CI-only failure appears.
  browser:
    name: Browser contract (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phaze
          POSTGRES_PASSWORD: phaze
          POSTGRES_DB: phaze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phaze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # The harness derives the app's own database by appending `_browser` to this name, so it
      # never shares a database with the unit matrix (whose conftest drops the schema at teardown).
      TEST_DATABASE_URL: >-
        postgresql+asyncpg://phaze:phaze@localhost:5432/phaze_test
      PHAZE_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 🎭 Install the Chromium build
        run: just test-browser-install

      - name: 🌐 Run the browser contract suite
        # `just test-browser` depends on `tailwind`: without the compiled app.css the app serves an
        # unstyled page, and every layout assertion (drawer visibility, horizontal overflow) passes
        # vacuously. A browser suite with no CSS is worse than no browser suite.
        run: just test-browser
